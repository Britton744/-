<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم الملكية VIP | بريتون لايف</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F9E79F;
            --gold-dark: #997300;
            --neon-pink: #FF1493;
            --bg-night: #060209;
            --card-velvet: #12061A;
            --border-purple: #2F1138;
            --text-main: #FFFFFF;
            --text-sub: #BCAAA4;
            --danger: #FF3B30;
            --success: #00E676;
            --radius-md: 14px;
            --radius-lg: 22px;
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body {
            background-color: var(--bg-night);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
            background-image: radial-gradient(circle at 15% 15%, rgba(255, 20, 147, 0.12) 0%, transparent 45%),
                              radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
        }

        header.vip-header {
            background: rgba(14, 4, 22, 0.94);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-purple);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-zone { display: flex; align-items: center; gap: 10px; }
        .brand-zone i { color: var(--gold); font-size: 1.6rem; filter: drop-shadow(0 0 10px var(--neon-pink)); }
        .brand-zone h1 {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-live-store {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }

        .tabs-nav {
            display: flex; gap: 8px; overflow-x: auto;
            border-bottom: 1px solid var(--border-purple);
            padding-bottom: 12px; margin-bottom: 22px;
            scrollbar-width: none;
        }
        .tabs-nav::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--card-velvet);
            border: 1px solid var(--border-purple);
            color: var(--text-sub);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #880E4F, #D81B60);
            color: #FFF;
            border-color: var(--neon-pink);
            box-shadow: 0 4px 18px rgba(255, 20, 147, 0.4);
        }

        .panel-view { display: none; }
        .panel-view.active { display: block; }

        .box-card {
            background: var(--card-velvet);
            border: 1px solid var(--border-purple);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .box-title {
            font-size: 1.15rem;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--border-purple);
            padding-bottom: 12px;
            font-weight: 800;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        @media (min-width: 650px) { .form-grid-2 { grid-template-columns: 1fr 1fr; } }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .input-group label {
            font-size: 0.82rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .input-field {
            background: #08030C;
            border: 1px solid var(--border-purple);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 12px rgba(255, 20, 147, 0.4);
        }

        /* صندوق رفع الصور من الهاتف */
        .upload-drop-zone {
            background: #0A040E;
            border: 2px dashed var(--neon-pink);
            border-radius: var(--radius-md);
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 14px;
            position: relative;
        }

        .upload-drop-zone:hover {
            background: rgba(255, 20, 147, 0.08);
            border-color: var(--gold);
        }

        .upload-drop-zone i {
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .upload-drop-zone p {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .upload-drop-zone span {
            font-size: 0.75rem;
            color: var(--text-sub);
            display: block;
            margin-top: 4px;
        }

        #fileInput {
            display: none;
        }

        .preview-box {
            display: none;
            text-align: center;
            margin-top: 12px;
            position: relative;
        }

        .preview-box img {
            max-width: 160px;
            max-height: 160px;
            border-radius: 14px;
            border: 2px solid var(--gold);
            object-fit: cover;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.4);
        }

        .btn-vip {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            border: none;
            padding: 14px 22px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-del {
            background: rgba(255, 59, 48, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: right; }
        th { background: #190822; color: var(--gold); padding: 12px; border-bottom: 1px solid var(--border-purple); }
        td { padding: 12px; border-bottom: 1px solid var(--border-purple); vertical-align: middle; }
        .thumb-img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
    </style>
</head>
<body>

    <header class="vip-header">
        <div class="brand-zone">
            <i class="fa-solid fa-crown"></i>
            <h1>لوحة الملوك VIP</h1>
        </div>
        <a href="https://ten-sigma-61.vercel.app/" target="_blank" class="btn-live-store">
            <i class="fa-solid fa-eye"></i> عرض المتجر
        </a>
    </header>

    <div class="container">

        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('tab-add', this)"><i class="fa-solid fa-plus-circle"></i> إضافة منتج وصور</button>
            <button class="tab-btn" onclick="switchTab('tab-prods', this)"><i class="fa-solid fa-boxes-stacked"></i> المنتجات الحالية</button>
        </div>

        <!-- تبويب إضافة منتج مع رفع الصور من الهاتف -->
        <div id="tab-add" class="panel-view active">
            <div class="box-card">
                <div class="box-title"><i class="fa-solid fa-camera"></i> رفع صورة من المعرض وإضافة المنتج</div>

                <!-- صندوق رفع الصورة من الجوال مباشرة -->
                <div class="upload-drop-zone" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>اضغط هنا لاختيار صورة من استوديو جوالك 📷</p>
                    <span>يدعم جميع صيغ الصور (JPG, PNG, WebP)</span>
                </div>
                <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">

                <!-- معاينة الصورة بعد الاختيار -->
                <div class="preview-box" id="previewContainer">
                    <img id="imagePreview" src="" alt="معاينة">
                    <p style="font-size:0.75rem; color:var(--success); margin-top:6px;">✓ تم اختيار الصورة وجاهزة للنشر</p>
                </div>

                <div class="form-grid-2" style="margin-top:16px;">
                    <div class="input-group">
                        <label>اسم المنتج *</label>
                        <input type="text" id="addName" class="input-field" placeholder="مثال: هزاز الفراشة الذكي VIP">
                    </div>
                    <div class="input-group">
                        <label>القسم المخصص *</label>
                        <select id="addCat" class="input-field">
                            <option value="games">الألعاب الزوجية</option>
                            <option value="vibrators">الاهتزازات</option>
                            <option value="oils">زيوت ومنشطات</option>
                            <option value="care">العناية والجلاد</option>
                            <option value="dildo">القضبان الاصطناعية</option>
                            <option value="masturbator">المهبل الاصطناعي</option>
                            <option value="accessories">أدوات وملحقات</option>
                            <option value="featured">منتجات مميزة</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>السعر (ر.س) *</label>
                        <input type="number" id="addPrice" class="input-field" placeholder="185">
                    </div>
                    <div class="input-group">
                        <label>الوصف الحميمي المختصر *</label>
                        <input type="text" id="addSub" class="input-field" placeholder="مثال: خامة سيليكون فاخرة، شحن USB وتغليف سري">
                    </div>
                </div>

                <!-- خيار بديل في حال رغبت بوضع رابط صورة جاهز -->
                <div class="input-group">
                    <label>أو ضع رابط صورة مباشر (اختياري)</label>
                    <input type="url" id="addImgUrl" class="input-field" placeholder="https://..." oninput="handleUrlInput(this.value)">
                </div>

                <button class="btn-vip" style="margin-top:10px;" onclick="saveProductAction()">
                    <i class="fa-solid fa-check"></i> حفظ ونشر المنتج فوراً في المتجر
                </button>
            </div>
        </div>

        <!-- تبويب المنتجات الحالية -->
        <div id="tab-prods" class="panel-view">
            <div class="box-card">
                <div class="box-title"><i class="fa-solid fa-list-check"></i> المنتجات المعروضة في المتجر حالياً</div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>الصورة</th>
                                <th>اسم المنتج</th>
                                <th>القسم</th>
                                <th>السعر</th>
                                <th>الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentUploadedImageBase64 = "";

        const originalProducts = [
            { id: 1, name: "زيت التزليق المائي الفاخر", subtitle: "مائي وآمن على البشرة", category: "oils", price: 89, image: "https://images.unsplash.com/photo-1608248597359-bb4f4693a1cf?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "حلقة تأخير القذف السيليكونية", subtitle: "سيليكون مريح وقابل للتعديل", category: "accessories", price: 159, image: "https://images.unsplash.com/photo-1596433809252-260c2745dfdd?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "كرات كيجل الملكية", subtitle: "لتقوية العضلات وتحسين المتعة", category: "care", price: 199, image: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=600&q=80" },
            { id: 4, name: "هزاز أرنب المتطور VIP", subtitle: "10 سرعات - شحن USB فائق السرية", category: "vibrators", price: 249, image: "https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=600&q=80" },
            { id: 5, name: "مهبل صناعي واقعي تفاعلي", subtitle: "ملمس ناعم جداً - تصميم واقعي 100%", category: "masturbator", price: 1000, image: "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=600&q=80" },
            { id: 6, name: "قضيب صناعي واقعي مع قاعدة تثبيت", subtitle: "سيليكون طبي ناعم مع قاعدة تثبيت قوية", category: "dildo", price: 1100, image: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=600&q=80" },
            { id: 7, name: "لعبة كروت التحدي الرومانسية للمتزوجين", subtitle: "مستويات إثارة وغموض خاصة VIP", category: "games", price: 139, image: "https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?auto=format&fit=crop&w=600&q=80" }
        ];

        let myProducts = JSON.parse(localStorage.getItem('briton_store_products_v3')) || originalProducts;

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // قراءة وضغط الصورة المرفوعة من استوديو الجوال
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // تصغير مقاس الصورة قليلاً لتكون سريعة جداً في التحميل
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    currentUploadedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
                    document.getElementById('imagePreview').src = currentUploadedImageBase64;
                    document.getElementById('previewContainer').style.display = 'block';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleUrlInput(val) {
            if (val.trim()) {
                currentUploadedImageBase64 = val.trim();
                document.getElementById('imagePreview').src = currentUploadedImageBase64;
                document.getElementById('previewContainer').style.display = 'block';
            }
        }

        function renderAdminTable() {
            document.getElementById('productsTableBody').innerHTML = myProducts.map((p, idx) => `
                <tr>
                    <td><img src="${p.image}" class="thumb-img" alt=""></td>
                    <td style="font-weight:700;">${p.name}</td>
                    <td><span style="color:var(--gold); font-size:0.8rem;">${p.category}</span></td>
                    <td style="color:var(--gold); font-weight:900;">${p.price} ر.س</td>
                    <td>
                        <button class="btn-del" onclick="deleteProductAction(${idx})">
                            <i class="fa-solid fa-trash"></i> حذف
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function saveProductAction() {
            const name = document.getElementById('addName').value.trim();
            const category = document.getElementById('addCat').value;
            const price = parseFloat(document.getElementById('addPrice').value);
            const subtitle = document.getElementById('addSub').value.trim() || "تغليف سري ومميز";
            const image = currentUploadedImageBase64 || "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=600&q=80";

            if (!name || isNaN(price)) return alert("يرجى إدخال اسم المنتج وسعره.");

            myProducts.unshift({ id: Date.now(), name, subtitle, category, price, image });
            localStorage.setItem('briton_store_products_v3', JSON.stringify(myProducts));
            renderAdminTable();

            document.getElementById('addName').value = '';
            document.getElementById('addPrice').value = '';
            document.getElementById('addSub').value = '';
            document.getElementById('addImgUrl').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('previewContainer').style.display = 'none';
            currentUploadedImageBase64 = "";

            alert("✅ تم رفع الصورة وحفظ المنتج بنجاح في متجرك!");
            switchTab('tab-prods', document.querySelectorAll('.tab-btn')[1]);
        }

        function deleteProductAction(idx) {
            if (confirm("هل تريد حذف هذا المنتج من المتجر؟")) {
                myProducts.splice(idx, 1);
                localStorage.setItem('briton_store_products_v3', JSON.stringify(myProducts));
                renderAdminTable();
            }
        }

        window.onload = renderAdminTable;
    </script>
</body>
</html>
