<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم BRITTON LIFE الفاخرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0d0208; color: #fce7f3; background-image: radial-gradient(circle at 50% 0%, #e11d4825, transparent 48%), radial-gradient(circle at 100% 45%, #8b5cf622, transparent 42%); min-height: 100vh; }
        .brand { font-family: 'Cinzel', serif; background: linear-gradient(135deg, #fff7cc, #fbbf24, #d97706); -webkit-background-clip: text; color: transparent; }
        .card { background: linear-gradient(155deg, #1e0617eb, #0d0208fa); border: 1px solid #e11d483f; border-radius: 16px; box-shadow: 0 10px 30px #0009; }
        .hidebar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 sm:p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- الهيدر العلوي -->
        <header class="card p-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-amber-400 grid place-items-center text-amber-300 font-bold">👑</div>
                <div>
                    <h1 class="brand text-lg font-black">BRITTON LIFE</h1>
                    <span class="text-[10px] text-pink-200/60">مدير المتجر: roooo77775@gmail.com</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs border border-emerald-500/20">🟢 النظام يعمل</span>
                <button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-rose-950/60 text-rose-400 text-xs border border-rose-800 hover:bg-rose-900"><i class="fas fa-sign-out-alt ml-1"></i>خروج</button>
            </div>
        </header>

        <!-- لوحة الإحصائيات (مصفرة تماماً من الصفر) -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="card p-4 text-center">
                <span class="text-xs text-pink-200/60 block mb-1">إجمالي العملاء / الزوار</span>
                <strong class="text-xl text-amber-300 font-black">0</strong>
            </div>
            <div class="card p-4 text-center">
                <span class="text-xs text-pink-200/60 block mb-1">إجمالي الطلبات</span>
                <strong class="text-xl text-amber-300 font-black">0 طلب</strong>
            </div>
            <div class="card p-4 text-center">
                <span class="text-xs text-pink-200/60 block mb-1">إجمالي المنتجات</span>
                <strong id="statProdCount" class="text-xl text-amber-300 font-black">0</strong>
            </div>
            <div class="card p-4 text-center">
                <span class="text-xs text-pink-200/60 block mb-1">إجمالي المبيعات</span>
                <strong class="text-xl text-emerald-400 font-black">0 ر.س</strong>
            </div>
        </div>

        <!-- منطقة العمل الرئيسية: إضافة منتج أو قسم -->
        <div class="grid md:grid-cols-2 gap-6">
            
            <!-- إضافة منتج جديد -->
            <div class="card p-6 space-y-4">
                <h2 class="text-base font-bold text-amber-300 flex items-center gap-2"><i class="fas fa-box-open text-rose-500"></i>إضافة منتج جديد للمتجر</h2>
                <form onsubmit="handleAddProduct(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs text-pink-100/70 mb-1">اسم المنتج:</label>
                        <input type="text" id="pName" required placeholder="مثال: طقم لانجري فاخر" class="w-full p-3 rounded-xl bg-black border border-rose-900 text-white text-sm outline-none focus:border-amber-400">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-pink-100/70 mb-1">السعر (ر.س):</label>
                            <input type="number" id="pPrice" required placeholder="149" class="w-full p-3 rounded-xl bg-black border border-rose-900 text-white text-sm outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-pink-100/70 mb-1">اختر القسم:</label>
                            <select id="pCat" class="w-full p-3 rounded-xl bg-black border border-rose-900 text-white text-sm outline-none">
                                <option value="featured">منتجات مميزة</option>
                                <option value="couples">ألعاب زوجية</option>
                                <option value="vibrators">أجهزة هزاز</option>
                                <option value="dildos">قضبان صناعية</option>
                                <option value="vaginal">مهبليات صناعية</option>
                                <option value="accessories">إكسسوارات</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-pink-100/70 mb-1">رابط الصورة (URL):</label>
                        <input type="text" id="pImage" placeholder="ضع رابط صورة المنتج هنا" class="w-full p-3 rounded-xl bg-black border border-rose-900 text-white text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-pink-100/70 mb-1">وصف المنتج:</label>
                        <textarea id="pDesc" rows="2" placeholder="وصف موجز للمنتج..." class="w-full p-3 rounded-xl bg-black border border-rose-900 text-white text-sm outline-none resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-rose-700 to-amber-600 font-bold text-sm text-white shadow-lg hover:opacity-90 transition">نشر المنتج في المتجر 🚀</button>
                </form>
            </div>

            <!-- إضافة قسم جديد وإدارة الإعدادات -->
            <div class="card p-6 space-y-6">
                <div class="space-y-4">
                    <h2 class="text-base font-bold text-amber-300 flex items-center gap-2"><i class="fas fa-th-large text-rose-500"></i>إضافة قسم جديد</h2>
                    <form onsubmit="handleAddCat(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs text-pink-100/70 mb-1">اسم القسم:</label>
                            <input type="text" id="catName" required placeholder="مثال: زيوت ومساج" class="w-full p-3 rounded-xl bg-black border border-rose-900 text-white text-sm outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-pink-100/70 mb-1">رابط صورة القسم:</label>
                            <input type="text" id="catImage" placeholder="رابط صورة دائرية للقسم" class="w-full p-3 rounded-xl bg-black border border-rose-900 text-white text-sm outline-none">
                        </div>
                        <button type="submit" class="w-full py-3 rounded-xl bg-rose-700 hover:bg-rose-600 font-bold text-sm text-white transition">إضافة القسم للمتجر</button>
                    </form>
                </div>

                <div class="border-t border-rose-950 pt-4 space-y-3">
                    <h3 class="text-sm font-bold text-amber-300">إعدادات الإدارة والبريد</h3>
                    <input type="email" id="settingsEmail" value="roooo77775@gmail.com" class="w-full p-2.5 rounded-xl bg-black border border-rose-900 text-xs text-white">
                    <button onclick="saveSettings()" class="w-full py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 font-bold text-xs text-white transition">حفظ إعدادات البريد</button>
                </div>
            </div>

        </div>

    </div>

    <script>
        // تحديث إحصائيات المنتجات عند الفتح
        document.addEventListener("DOMContentLoaded", () => {
            updateStats();
        });

        function updateStats() {
            let products = JSON.parse(localStorage.getItem('bl_products')) || [];
            document.getElementById('statProdCount').textContent = products.length;
        }

        function handleAddProduct(e) {
            e.preventDefault();
            let name = document.getElementById('pName').value;
            let price = Number(document.getElementById('pPrice').value);
            let cat = document.getElementById('pCat').value;
            let image = document.getElementById('pImage').value || 'https://images.unsplash.com/photo-1583846783214-7229a91b20ed?auto=format&fit=crop&w=400&q=80';
            let desc = document.getElementById('pDesc').value;

            let products = JSON.parse(localStorage.getItem('bl_products')) || [];
            products.unshift({ id: Date.now(), name, price, cat, image, desc });
            localStorage.setItem('bl_products', JSON.stringify(products));

            updateStats();
            alert('تم نشر المنتج بنجاح في المتجر وسيرى العملاء المنتج الآن! 🎉');
            e.target.reset();
        }

        function handleAddCat(e) {
            e.preventDefault();
            let name = document.getElementById('catName').value;
            let image = document.getElementById('catImage').value || 'https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=300&q=80';

            let categories = JSON.parse(localStorage.getItem('bl_categories')) || [];
            categories.push({ id: 'c_' + Date.now(), name, image });
            localStorage.setItem('bl_categories', JSON.stringify(categories));

            alert('تم إضافة القسم بنجاح!');
            e.target.reset();
        }

        function saveSettings() {
            alert('تم حفظ البريد الإلكتروني بنجاح لتلقي الفواتير عليه!');
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
