<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم الملكية الشاملة | بريتون لايف</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F9E79F;
            --gold-dark: #997300;
            --neon-pink: #FF1493;
            --bg-night: #060209;
            --card-velvet: #12061A;
            --border-purple: #2F1138;
            --text-main: #FFFFFF;
            --text-sub: #BCAAA4;
            --danger: #FF3B30;
            --success: #00E676;
            --radius-md: 14px;
            --radius-lg: 22px;
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body {
            background-color: var(--bg-night);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        header.vip-header {
            background: rgba(14, 4, 22, 0.94);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-purple);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-zone { display: flex; align-items: center; gap: 10px; }
        .brand-zone i { color: var(--gold); font-size: 1.6rem; filter: drop-shadow(0 0 10px var(--neon-pink)); }
        .brand-zone h1 {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-live-store {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }

        .tabs-nav {
            display: flex; gap: 8px; overflow-x: auto;
            border-bottom: 1px solid var(--border-purple);
            padding-bottom: 12px; margin-bottom: 22px;
            scrollbar-width: none;
        }
        .tabs-nav::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--card-velvet);
            border: 1px solid var(--border-purple);
            color: var(--text-sub);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #880E4F, #D81B60);
            color: #FFF;
            border-color: var(--neon-pink);
            box-shadow: 0 4px 18px rgba(255, 20, 147, 0.4);
        }

        .panel-view { display: none; }
        .panel-view.active { display: block; }

        .box-card {
            background: var(--card-velvet);
            border: 1px solid var(--border-purple);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .box-title {
            font-size: 1.15rem;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--border-purple);
            padding-bottom: 12px;
            font-weight: 800;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        @media (min-width: 650px) { .form-grid-2 { grid-template-columns: 1fr 1fr; } }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .input-group label {
            font-size: 0.82rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .input-field {
            background: #08030C;
            border: 1px solid var(--border-purple);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 12px rgba(255, 20, 147, 0.4);
        }

        /* حاوية رفع 3 صور */
        .images-upload-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .image-upload-box {
            background: #0A040E;
            border: 2px dashed var(--border-purple);
            border-radius: var(--radius-md);
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .image-upload-box:hover {
            border-color: var(--neon-pink);
            background: rgba(255, 20, 147, 0.05);
        }

        .image-upload-box i { font-size: 1.5rem; color: var(--gold); margin-bottom: 4px; }
        .image-upload-box span { font-size: 0.7rem; color: var(--text-sub); }
        .image-upload-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; }

        .btn-vip {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            border: none;
            padding: 14px 22px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-del {
            background: rgba(255, 59, 48, 0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: right; }
        th { background: #190822; color: var(--gold); padding: 12px; border-bottom: 1px solid var(--border-purple); }
        td { padding: 12px; border-bottom: 1px solid var(--border-purple); vertical-align: middle; }
        .thumb-img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
    </style>
</head>
<body>

    <header class="vip-header">
        <div class="brand-zone">
            <i class="fa-solid fa-crown"></i>
            <h1 id="panelStoreName">لوحة التحكم الملكية</h1>
        </div>
        <a href="https://ten-sigma-61.vercel.app/" target="_blank" class="btn-live-store">
            <i class="fa-solid fa-eye"></i> عرض المتجر
        </a>
    </header>

    <div class="container">

        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('tab-settings', this)"><i class="fa-solid fa-gear"></i> هوية المتجر والبيانات</button>
            <button class="tab-btn" onclick="switchTab('tab-add', this)"><i class="fa-solid fa-plus-circle"></i> إضافة منتج (3 صور)</button>
            <button class="tab-btn" onclick="switchTab('tab-prods', this)"><i class="fa-solid fa-boxes-stacked"></i> المنتجات الحالية</button>
        </div>

        <!-- تبويب 1: إعدادات هوية المتجر (الاسم، الشعار، الهاتف، البريد، الخلفية) -->
        <div id="tab-settings" class="panel-view active">
            <div class="box-card">
                <div class="box-title"><i class="fa-solid fa-sliders"></i> بيانات وهوية المتجر الأساسية</div>
                
                <div class="form-grid-2">
                    <div class="input-group">
                        <label>اسم المتجر الرئيسي *</label>
                        <input type="text" id="settingStoreName" class="input-field" placeholder="بريتون لايف | BRITON LIFE">
                    </div>
                    <div class="input-group">
                        <label>رقم هاتف الواتساب لتلقي الطلبات *</label>
                        <input type="text" id="settingWhatsapp" class="input-field" placeholder="55 657 5822">
                    </div>
                    <div class="input-group">
                        <label>البريد الإلكتروني للإشعارات والفواتير *</label>
                        <input type="email" id="settingEmail" class="input-field" placeholder="roooo77775@gmail.com">
                    </div>
                    <div class="input-group">
                        <label>رابط الشعار المخصص (أيقونة/صورة)</label>
                        <input type="url" id="settingLogoUrl" class="input-field" placeholder="https://... أو اتركها فارغة لاستخدام التاج الملكي">
                    </div>
                </div>

                <div class="box-title" style="margin-top:20px;"><i class="fa-solid fa-palette"></i> مظهر وخلفية المتجر</div>
                <div class="form-grid-2">
                    <div class="input-group">
                        <label>لون الخلفية الأساسي</label>
                        <input type="color" id="settingBgColor" class="input-field" value="#080509" style="height:50px; cursor:pointer;">
                    </div>
                    <div class="input-group">
                        <label>رابط صورة الخلفية المخصصة (اختياري)</label>
                        <input type="url" id="settingBgImage" class="input-field" placeholder="https://... رابط صورة خلفية للموقع">
                    </div>
                </div>

                <button class="btn-vip" onclick="saveStoreSettings()">
                    <i class="fa-solid fa-floppy-disk"></i> حفظ كافة التعديلات وتحديث المتجر فوراً
                </button>
            </div>
        </div>

        <!-- تبويب 2: إضافة منتج مع 3 صور -->
        <div id="tab-add" class="panel-view">
            <div class="box-card">
                <div class="box-title"><i class="fa-solid fa-camera"></i> إضافة منتج جديد (رفع حتى 3 صور)</div>

                <label style="font-size:0.85rem; color:var(--text-sub); display:block; margin-bottom:8px;">اختر صور المنتج (اضغط على كل مربع لرفع صورة من استوديو الجوال):</label>
                <div class="images-upload-container">
                    <div class="image-upload-box" onclick="triggerFile(1)" id="boxImg1">
                        <i class="fa-solid fa-image"></i>
                        <span>الصورة 1 (الرئيسية)</span>
                        <input type="file" id="file1" accept="image/*" style="display:none;" onchange="processImage(event, 1)">
                    </div>
                    <div class="image-upload-box" onclick="triggerFile(2)" id="boxImg2">
                        <i class="fa-solid fa-image"></i>
                        <span>الصورة 2</span>
                        <input type="file" id="file2" accept="image/*" style="display:none;" onchange="processImage(event, 2)">
                    </div>
                    <div class="image-upload-box" onclick="triggerFile(3)" id="boxImg3">
                        <i class="fa-solid fa-image"></i>
                        <span>الصورة 3</span>
                        <input type="file" id="file3" accept="image/*" style="display:none;" onchange="processImage(event, 3)">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="input-group">
                        <label>اسم المنتج *</label>
                        <input type="text" id="addName" class="input-field" placeholder="مثال: هزاز الفراشة الذكي VIP">
                    </div>
                    <div class="input-group">
                        <label>القسم المخصص *</label>
                        <select id="addCat" class="input-field">
                            <option value="games">الألعاب الزوجية</option>
                            <option value="vibrators">الاهتزازات</option>
                            <option value="oils">زيوت ومنشطات</option>
                            <option value="care">العناية والجلاد</option>
                            <option value="dildo">القضبان الاصطناعية</option>
                            <option value="masturbator">المهبل الاصطناعي</option>
                            <option value="accessories">أدوات وملحقات</option>
                            <option value="featured">منتجات مميزة</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>السعر (ر.س) *</label>
                        <input type="number" id="addPrice" class="input-field" placeholder="185">
                    </div>
                    <div class="input-group">
                        <label>الوصف الحميمي المختصر *</label>
                        <input type="text" id="addSub" class="input-field" placeholder="مثال: سيليكون طبي فاخر، شحن USB وتغليف سري">
                    </div>
                </div>

                <button class="btn-vip" style="margin-top:10px;" onclick="saveProductAction()">
                    <i class="fa-solid fa-check"></i> حفظ ونشر المنتج فوراً في المتجر
                </button>
            </div>
        </div>

        <!-- تبويب 3: المنتجات الحالية -->
        <div id="tab-prods" class="panel-view">
            <div class="box-card">
                <div class="box-title"><i class="fa-solid fa-list-check"></i> المنتجات المعروضة في المتجر حالياً</div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>الصور</th>
                                <th>اسم المنتج</th>
                                <th>القسم</th>
                                <th>السعر</th>
                                <th>الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        let uploadedImages = ["", "", ""];

        const defaultSettings = {
            name: "BRITON LIFE",
            phone: "55 657 5822",
            email: "roooo77775@gmail.com",
            logo: "",
            bgColor: "#080509",
            bgImage: ""
        };

        const originalProducts = [
            { id: 1, name: "زيت التزليق المائي الفاخر", subtitle: "مائي وآمن على البشرة", category: "oils", price: 89, images: ["https://images.unsplash.com/photo-1608248597359-bb4f4693a1cf?auto=format&fit=crop&w=600&q=80"] },
            { id: 2, name: "حلقة تأخير القذف السيليكونية", subtitle: "سيليكون مريح وقابل للتعديل", category: "accessories", price: 159, images: ["https://images.unsplash.com/photo-1596433809252-260c2745dfdd?auto=format&fit=crop&w=600&q=80"] },
            { id: 3, name: "كرات كيجل الملكية", subtitle: "لتقوية العضلات وتحسين المتعة", category: "care", price: 199, images: ["https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=600&q=80"] },
            { id: 4, name: "هزاز أرنب المتطور VIP", subtitle: "10 سرعات - شحن USB فائق السرية", category: "vibrators", price: 249, images: ["https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=600&q=80"] },
            { id: 5, name: "مهبل صناعي واقعي تفاعلي", subtitle: "ملمس ناعم جداً - تصميم واقعي 100%", category: "masturbator", price: 1000, images: ["https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=600&q=80"] },
            { id: 6, name: "قضيب صناعي واقعي مع قاعدة تثبيت", subtitle: "سيليكون طبي ناعم مع قاعدة تثبيت قوية", category: "dildo", price: 1100, images: ["https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=600&q=80"] },
            { id: 7, name: "لعبة كروت التحدي الرومانسية للمتزوجين", subtitle: "مستويات إثارة وغموض خاصة VIP", category: "games", price: 139, images: ["https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?auto=format&fit=crop&w=600&q=80"] }
        ];

        let storeConfig = JSON.parse(localStorage.getItem('briton_store_config')) || defaultSettings;
        let myProducts = JSON.parse(localStorage.getItem('briton_store_products_v4')) || originalProducts;

        function initSettings() {
            document.getElementById('settingStoreName').value = storeConfig.name;
            document.getElementById('settingWhatsapp').value = storeConfig.phone;
            document.getElementById('settingEmail').value = storeConfig.email;
            document.getElementById('settingLogoUrl').value = storeConfig.logo;
            document.getElementById('settingBgColor').value = storeConfig.bgColor || "#080509";
            document.getElementById('settingBgImage').value = storeConfig.bgImage || "";
            document.getElementById('panelStoreName').innerText = storeConfig.name;
        }

        function saveStoreSettings() {
            storeConfig.name = document.getElementById('settingStoreName').value.trim() || "BRITON LIFE";
            storeConfig.phone = document.getElementById('settingWhatsapp').value.trim() || "55 657 5822";
            storeConfig.email = document.getElementById('settingEmail').value.trim() || "roooo77775@gmail.com";
            storeConfig.logo = document.getElementById('settingLogoUrl').value.trim();
            storeConfig.bgColor = document.getElementById('settingBgColor').value;
            storeConfig.bgImage = document.getElementById('settingBgImage').value.trim();

            localStorage.setItem('briton_store_config', JSON.stringify(storeConfig));
            document.getElementById('panelStoreName').innerText = storeConfig.name;
            alert("✅ تم حفظ كافة إعدادات الهوية والخلفية والاتصال بنجاح!");
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function triggerFile(num) {
            document.getElementById(`file${num}`).click();
        }

        function processImage(e, num) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    const base64 = canvas.toDataURL('image/jpeg', 0.85);
                    uploadedImages[num - 1] = base64;
                    document.getElementById(`boxImg${num}`).innerHTML = `<img src="${base64}">`;
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderAdminTable() {
            document.getElementById('productsTableBody').innerHTML = myProducts.map((p, idx) => {
                const imgs = p.images || [p.image];
                return `
                <tr>
                    <td><img src="${imgs[0]}" class="thumb-img" alt=""></td>
                    <td style="font-weight:700;">${p.name} <br><span style="font-size:0.75rem; color:var(--text-sub);">(${imgs.length} صور)</span></td>
                    <td><span style="color:var(--gold); font-size:0.8rem;">${p.category}</span></td>
                    <td style="color:var(--gold); font-weight:900;">${p.price} ر.س</td>
                    <td>
                        <button class="btn-del" onclick="deleteProductAction(${idx})">
                            <i class="fa-solid fa-trash"></i> حذف
                        </button>
                    </td>
                </tr>
            `}).join('');
        }

        function saveProductAction() {
            const name = document.getElementById('addName').value.trim();
            const category = document.getElementById('addCat').value;
            const price = parseFloat(document.getElementById('addPrice').value);
            const subtitle = document.getElementById('addSub').value.trim() || "تغليف سري ومميز";

            const validImages = uploadedImages.filter(img => img !== "");
            if (validImages.length === 0) {
                validImages.push("https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=600&q=80");
            }

            if (!name || isNaN(price)) return alert("يرجى إدخال اسم المنتج والسعر.");

            myProducts.unshift({ id: Date.now(), name, subtitle, category, price, images: validImages });
            localStorage.setItem('briton_store_products_v4', JSON.stringify(myProducts));
            renderAdminTable();

            document.getElementById('addName').value = '';
            document.getElementById('addPrice').value = '';
            document.getElementById('addSub').value = '';
            uploadedImages = ["", "", ""];
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`boxImg${i}`).innerHTML = `<i class="fa-solid fa-image"></i><span>الصورة ${i}</span><input type="file" id="file${i}" accept="image/*" style="display:none;" onchange="processImage(event, ${i})">`;
            }

            alert("✅ تم رفع الصور ونشر المنتج بنجاح!");
            switchTab('tab-prods', document.querySelectorAll('.tab-btn')[2]);
        }

        function deleteProductAction(idx) {
            if (confirm("هل تريد حذف هذا المنتج؟")) {
                myProducts.splice(idx, 1);
                localStorage.setItem('briton_store_products_v4', JSON.stringify(myProducts));
                renderAdminTable();
            }
        }

        window.onload = function() {
            initSettings();
            renderAdminTable();
        };
    </script>
</body>
</html>
