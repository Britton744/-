<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="google-site-verification" content="-_85mKpuCRsJy54bcy29viKaJZEzW9YOceCxsn5RIHg" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRITON LIFE | متجر الملوك</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #AA7C11;
            --neon-pink: #D81B60;
            --card-bg: #140E19;
            --card-border: #2B1829;
            --text-light: #F5F5F7;
            --text-muted: #A397A6;
            --radius-md: 12px;
            --radius-lg: 18px;
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body {
            background-color: #080509;
            color: var(--text-light);
            line-height: 1.6;
            padding-bottom: 90px;
        }

        header.top-header {
            background: rgba(12, 7, 14, 0.96); backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 18px; position: sticky; top: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }

        .header-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .header-logo i { color: var(--gold); font-size: 1.6rem; }
        .header-logo-text h1 {
            font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 900;
            background: linear-gradient(135deg, #FFF, var(--gold-light), var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;
        }
        .header-logo-text span { font-size: 0.6rem; color: var(--gold); letter-spacing: 2px; }

        .header-actions { display: flex; align-items: center; gap: 10px; }
        .icon-btn {
            background: #1A0F21; border: 1px solid var(--card-border); color: var(--gold-light);
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 1.05rem; cursor: pointer; position: relative; text-decoration: none;
        }
        .badge-count {
            position: absolute; top: -4px; right: -4px; background: var(--neon-pink);
            color: white; font-size: 0.68rem; font-weight: 800; width: 18px; height: 18px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        .section-header-wrap {
            display: flex; align-items: center; justify-content: center; gap: 12px; margin: 24px 0 14px;
        }
        .section-header-title { font-size: 1.2rem; font-weight: 800; color: var(--gold); display: flex; align-items: center; gap: 8px; }

        /* الأقسام الدائرية */
        .categories-carousel-scroll {
            display: flex; gap: 14px; padding: 10px 18px 20px; overflow-x: auto; white-space: nowrap; scrollbar-width: none;
        }
        .categories-carousel-scroll::-webkit-scrollbar { display: none; }
        .circle-cat-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 80px; flex-shrink: 0; }
        .circle-ring {
            width: 74px; height: 74px; border-radius: 50%; padding: 3px;
            background: linear-gradient(135deg, var(--gold-dark), var(--neon-pink));
            display: flex; align-items: center; justify-content: center;
        }
        .circle-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .circle-cat-item span { margin-top: 8px; font-size: 0.75rem; font-weight: 700; color: var(--text-light); text-align: center; }
        .circle-cat-item.active span { color: var(--gold); }

        /* كروت المنتجات وشبكة العرض */
        .products-deck {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 16px; max-width: 1200px; margin: 0 auto;
        }
        @media (min-width: 768px) { .products-deck { grid-template-columns: repeat(4, 1fr); gap: 18px; } }

        .prod-card-box {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        .prod-img-zone {
            position: relative; width: 100%; padding-top: 100%; background: #190E1F; overflow: hidden;
        }
        .prod-img-zone img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }

        .badge-choice {
            position: absolute; top: 8px; right: 8px; background: rgba(20, 14, 25, 0.85);
            border: 1px solid var(--card-border); color: var(--gold); font-size: 0.68rem;
            padding: 3px 8px; border-radius: 12px; font-weight: 700; z-index: 2;
        }

        .prod-content { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .prod-title { font-size: 0.88rem; font-weight: 700; height: 2.5em; overflow: hidden; margin-bottom: 6px; }
        .main-price { font-size: 1.1rem; font-weight: 900; color: var(--gold-light); margin-bottom: 10px; }

        .btn-order-add {
            background: linear-gradient(135deg, #1F1024, #2A1432); border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--gold-light); padding: 8px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.82rem; cursor: pointer; width: 100%;
        }

        /* نافذة السلة */
        .modal-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
        .modal-screen.active { display: flex !important; }
        .modal-card { background: #140E19; border: 1px solid var(--card-border); border-radius: var(--radius-lg); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 20px; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
        .close-btn { background: none; border: none; color: #888; font-size: 1.5rem; cursor: pointer; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .input-control { width: 100%; background: #0A060C; border: 1px solid var(--card-border); padding: 10px 12px; border-radius: var(--radius-md); color: white; outline: none; }

        .footer-nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13, 8, 16, 0.98);
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 999;
        }
        .f-nav-item { color: var(--text-muted); background: none; border: none; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; gap: 4px; cursor: pointer; text-decoration: none; }
        .f-nav-item.active { color: var(--gold); }
    </style>
</head>
<body>

    <header class="top-header">
        <a href="https://ten-sigma-61.vercel.app/" class="header-logo">
            <i class="fa-solid fa-crown"></i>
            <div class="header-logo-text">
                <h1>BRITON LIFE</h1>
                <span>LUXURY • PRIVACY • CARE</span>
            </div>
        </a>
        <div class="header-actions">
            <a href="https://wa.me/966556575822" target="_blank" class="icon-btn"><i class="fa-brands fa-whatsapp"></i></a>
            <button class="icon-btn" onclick="openCartModal()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge-count" id="cartBadgeCount">0</span>
            </button>
        </div>
    </header>

    <!-- تسوق حسب القسم -->
    <div class="section-header-wrap">
        <div class="section-header-title"><i class="fa-solid fa-layer-group"></i> تسوّق حسب القسم</div>
    </div>

    <div class="categories-carousel-scroll">
        <div class="circle-cat-item active" onclick="filterCat('all', this)"><div class="circle-ring"><img src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=150&q=80"></div><span>الكل</span></div>
        <div class="circle-cat-item" onclick="filterCat('featured', this)"><div class="circle-ring"><img src="https://images.unsplash.com/photo-1513885535751-8b9238bd345a?auto=format&fit=crop&w=150&q=80"></div><span>منتجات مميزة</span></div>
        <div class="circle-cat-item" onclick="filterCat('games', this)"><div class="circle-ring"><img src="https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?auto=format&fit=crop&w=150&q=80"></div><span>الألعاب الزوجية</span></div>
        <div class="circle-cat-item" onclick="filterCat('vibrators', this)"><div class="circle-ring"><img src="https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=150&q=80"></div><span>أجهزة الاهتزاز</span></div>
        <div class="circle-cat-item" onclick="filterCat('oils', this)"><div class="circle-ring"><img src="https://images.unsplash.com/photo-1608248597359-bb4f4693a1cf?auto=format&fit=crop&w=150&q=80"></div><span>زيوت ومنشطات</span></div>
    </div>

    <!-- شبكة المنتجات -->
    <div class="section-header-wrap">
        <div class="section-header-title"><i class="fa-solid fa-crown"></i> مجموعة بريتون لايف</div>
    </div>

    <main class="products-deck" id="productsDeck"></main>

    <!-- نافذة السلة -->
    <div class="modal-screen" id="cartModal">
        <div class="modal-card">
            <div class="modal-head">
                <h3 style="color:var(--gold)"><i class="fa-solid fa-bag-shopping"></i> سلة طلبات المتجر</h3>
                <button class="close-btn" onclick="closeCartModal()">&times;</button>
            </div>
            <div id="cartItemsContainer"></div>
            <div style="display:flex; justify-content:space-between; margin:14px 0; font-weight:800;">
                <span>المجموع الكلي:</span>
                <span id="cartTotalPrice" style="color:var(--gold)">0 ر.س</span>
            </div>
            <div class="input-group"><label>الاسم أو اللقب *</label><input type="text" id="custName" class="input-control" placeholder="الاسم الكريم"></div>
            <div class="input-group"><label>رقم الجوال *</label><input type="tel" id="custPhone" class="input-control" placeholder="05xxxxxxxx"></div>
            <div class="input-group"><label>المدينة والحي (شحن سري) *</label><input type="text" id="custAddress" class="input-control" placeholder="الرياض، جدة..."></div>
            <button class="btn-order-add" style="background:#25D366; color:white; border:none; padding:12px; margin-top:10px;" onclick="completeOrderWhatsapp()">
                <i class="fa-brands fa-whatsapp"></i> إرسال الطلب عبر الواتساب
            </button>
        </div>
    </div>

    <nav class="footer-nav-bar">
        <a href="https://ten-sigma-61.vercel.app/" class="f-nav-item active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
        <button class="f-nav-item" onclick="openCartModal()"><i class="fa-solid fa-cart-shopping"></i><span>السلة</span></button>
        <a href="https://wa.me/966556575822" target="_blank" class="f-nav-item"><i class="fa-brands fa-whatsapp"></i><span>واتساب</span></a>
    </nav>

    <script>
        const validProducts = [
            { id: 1, name: "زيت التزليق المائي الفاخر", category: "oils", price: 89, image: "https://images.unsplash.com/photo-1608248597359-bb4f4693a1cf?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "حلقة تأخير القذف السيليكونية", category: "accessories", price: 159, image: "https://images.unsplash.com/photo-1596433809252-260c2745dfdd?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "كرات كيجل الملكية", category: "care", price: 199, image: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=600&q=80" },
            { id: 4, name: "هزاز أرنب المتطور VIP", category: "vibrators", price: 249, image: "https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=600&q=80" },
            { id: 5, name: "مهبل صناعي واقعي تفاعلي", category: "masturbator", price: 1000, image: "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=600&q=80" },
            { id: 6, name: "قضيب صناعي واقعي مع قاعدة تثبيت", category: "dildo", price: 1100, image: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=600&q=80" },
            { id: 7, name: "لعبة كروت التحدي الرومانسية للمتزوجين", category: "games", price: 139, image: "https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?auto=format&fit=crop&w=600&q=80" },
            { id: 8, name: "طقم المساج والإثارة الفاخر VIP", category: "featured", price: 320, image: "https://images.unsplash.com/photo-1513885535751-8b9238bd345a?auto=format&fit=crop&w=600&q=80" }
        ];

        // تنظيف التخزين الفارغ القديم لضمان ظهور الصور فوراً
        localStorage.removeItem('briton_store_products_v3');
        localStorage.removeItem('briton_store_products_v4');
        let catalog = validProducts;
        let cartItems = [];

        function renderDeck(items) {
            document.getElementById('productsDeck').innerHTML = items.map(p => `
                <div class="prod-card-box">
                    <div class="prod-img-zone">
                        <span class="badge-choice">اختيار مميز</span>
                        <img src="${p.image}" onerror="this.src='https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=600&q=80'" alt="${p.name}">
                    </div>
                    <div class="prod-content">
                        <h3 class="prod-title">${p.name}</h3>
                        <span class="main-price">${p.price} ر.س</span>
                        <button class="btn-order-add" onclick="addToCartItem(${p.id})">أضف إلى السلة</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.circle-cat-item').forEach(c => c.classList.remove('active'));
            if(el) el.classList.add('active');
            renderDeck(cat === 'all' ? catalog : catalog.filter(p => p.category === cat));
        }

        function addToCartItem(id) {
            const product = catalog.find(p => p.id === id);
            const exist = cartItems.find(i => i.id === id);
            if (exist) exist.qty++; else cartItems.push({ ...product, qty: 1 });
            updateCartVisuals();
            openCartModal();
        }

        function updateCartVisuals() {
            document.getElementById('cartBadgeCount').innerText = cartItems.reduce((s, i) => s + i.qty, 0);
            let total = 0;
            document.getElementById('cartItemsContainer').innerHTML = cartItems.map((i, idx) => {
                total += i.price * i.qty;
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#1C1322; padding:10px; border-radius:8px; margin-bottom:8px;">
                        <div>
                            <div style="font-weight:700; font-size:0.85rem;">${i.name}</div>
                            <div style="font-size:0.8rem; color:var(--gold);">${i.price} ر.س × ${i.qty}</div>
                        </div>
                        <button onclick="cartItems.splice(${idx},1);updateCartVisuals();" style="color:red; background:none; border:none; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            }).join('');
            document.getElementById('cartTotalPrice').innerText = total + " ر.س";
        }

        function openCartModal() { document.getElementById('cartModal').classList.add('active'); }
        function closeCartModal() { document.getElementById('cartModal').classList.remove('active'); }

        function completeOrderWhatsapp() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const addr = document.getElementById('custAddress').value.trim();
            if (!name || !phone || !addr || cartItems.length === 0) return alert("يرجى إكمال البيانات.");

            let items = cartItems.map(i => `• ${i.name} (${i.qty}) = ${i.price * i.qty} ر.س`).join('\n');
            let total = cartItems.reduce((s, i) => s + i.price * i.qty, 0);
            let msg = `👑 *طلب جديد من متجر بريتون لايف*\n👤 *العميل:* ${name}\n📱 *الجوال:* ${phone}\n📍 *العنوان:* ${addr}\n📦 *المنتجات:*\n${items}\n💰 *الإجمالي:* ${total} ر.س`;
            
            window.open(`https://wa.me/966556575822?text=${encodeURIComponent(msg)}`, '_blank');
            cartItems = []; updateCartVisuals(); closeCartModal();
        }

        window.onload = function() {
            renderDeck(catalog);
        };
    </script>
</body>
</html>
