<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بريتون | متجر الألعاب الزوجية</title>
<meta name="description" content="متجر بريتون للألعاب الزوجية والترفيهية بتصميم عصري وطلب سهل.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

*{box-sizing:border-box}
body{
 margin:0;
 font-family:Cairo,Tahoma,sans-serif;
 background:#fff7fb;
 color:#222;
}

header{
 background:linear-gradient(135deg,#8e24aa,#ec407a);
 color:white;
 text-align:center;
 padding:55px 20px;
 border-radius:0 0 45px 45px;
}

header h1{
 font-size:50px;
 margin:0;
}

header p{
 font-size:21px;
}

.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
 gap:25px;
 padding:35px;
}

.card{
 background:white;
 border-radius:25px;
 padding:25px;
 text-align:center;
 box-shadow:0 10px 30px rgba(0,0,0,.12);
 transition:.3s;
}

.card:hover{
 transform:translateY(-10px);
}

.card img{
 width:200px;
 height:200px;
 border-radius:20px;
}

h2{
 color:#8e24aa;
}

.price{
 color:#e91e63;
 font-size:22px;
 font-weight:bold;
}

button{
 background:#25D366;
 color:white;
 border:0;
 padding:14px 35px;
 border-radius:50px;
 font-size:18px;
 cursor:pointer;
}

footer{
 background:#4a148c;
 color:white;
 text-align:center;
 padding:20px;
}

</style>
</head>

<body>

<header>
<h1>💜 بريتون</h1>
<p>متجر الألعاب الزوجية والترفيه الخاص باللحظات المميزة</p>
</header>

<section class="products">

<div class="card">
<img src="https://via.placeholder.com/200">
<h2>لعبة التحدي</h2>
<p>لعبة ممتعة للزوجين</p>
<p class="price">50 ريال</p>
<button>اطلب عبر واتساب</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200">
<h2>لعبة الأسئلة</h2>
<p>أجواء ترفيه وتواصل</p>
<p class="price">75 ريال</p>
<button>اطلب عبر واتساب</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/200">
<h2>الباقة الخاصة</h2>
<p>اختيار مميز للهدايا</p>
<p class="price">120 ريال</p>
<button>اطلب عبر واتساب</button>
</div>

</section>

<footer>
© 2026 بريتون - جميع الحقوق محفوظة
</footer>

</body>
</html>
