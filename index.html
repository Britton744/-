<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر العاب زوجيه - متجر الملوك LUXE</title>
  <meta name="description" content="أفخم متجر العاب زوجيه في السعودية - منتجات حصرية، تغليف مخملي سري 100%، ودفع عند الاستلام.">

  <style>
    :root {
      --bg: #070709;
      --card-bg: #121118;
      --card-border: #2a1b2d;
      --pink: #f43f5e;
      --pink-glow: rgba(244, 63, 94, 0.45);
      --gold: #fbbf24;
      --text: #ffffff;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* الشريط العلوي */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 10, 16, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }

    .brand-crown {
      color: var(--gold);
      font-size: 24px;
      filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.5));
    }

    .brand-title {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-size: 10px;
      color: var(--pink);
      letter-spacing: 1px;
      display: block;
    }

    .cart-btn {
      position: relative;
      background: #1a1726;
      border: 1px solid var(--card-border);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--pink);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px var(--pink-glow);
    }

    /* البنر الرئيسي */
    .hero {
      margin: 15px;
      padding: 30px 20px;
      background: linear-gradient(135deg, #2b0b1c 0%, #160714 50%, #0c0812 100%);
      border: 1px solid #4a1932;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(244, 63, 94, 0.15);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid var(--pink);
      color: var(--pink);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .hero h2 {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #fff, #ffd6e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--pink), #be123c);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--pink-glow);
    }

    /* شريط المميزات */
    .perks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 0 15px 25px;
    }

    .perk-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
    }

    .perk-box i {
      display: block;
      color: var(--pink);
      font-size: 18px;
      margin-bottom: 5px;
    }

    /* العناوين والتصنيفات */
    .sec-head {
      padding: 0 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sec-head h3 {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sec-head h3 i {
      color: var(--pink);
    }

    .cats-bar {
      display: flex;
      gap: 10px;
      padding: 0 15px 25px;
      overflow-x: auto;
      scrollbar-width: none;
    }

      background: #151320;
