<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المنتجات - متجر الملوك</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #dfb872;
            --rose: #e11d48;
            --bg: #09030b;
            --card: #160818;
        }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; padding: 15px; }
        
        /* شاشة الدخول السرية */
        #loginScreen {
            max-width: 380px; margin: 80px auto; background: var(--card);
            padding: 25px; border-radius: 20px; border: 1px solid var(--gold);
            text-align: center; box-shadow: 0 0 25px rgba(225,29,72,0.3);
        }
        .pass-input {
            width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px;
            border: 1px solid var(--gold); background: #000; color: #fff;
            text-align: center; font-size: 16px; outline: none;
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #b45309);
            color: #000; font-weight: 900; border: none; padding: 12px 20px;
            border-radius: 10px; width: 100%; cursor: pointer; font-size: 15px;
        }

        /* اللوحة الرئيسية */
        #adminPanel { display: none; max-width: 700px; margin: 0 auto; }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid rgba(223,184,114,0.3); margin-bottom: 20px;
        }
        .add-box {
            background: var(--card); border: 1px solid rgba(223,184,114,0.3);
            border-radius: 16px; padding: 15px; margin-bottom: 25px;
        }
        .form-row { margin-bottom: 10px; }
        .form-row label { display: block; font-size: 12px; color: var(--gold); margin-bottom: 4px; }
        .form-row input, .form-row select {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444;
            background: #000; color: #fff; outline: none; font-size: 13px;
        }
        
        /* جدول المنتجات */
        .prod-item {
            background: var(--card); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 12px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .prod-info { flex-grow: 1; }
        .prod-name { font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .prod-price { font-size: 13px; color: var(--gold); font-weight: 900; }
        .prod-cat { font-size: 10px; color: #fda4af; }
        
        .action-btns { display: flex; gap: 6px; }
        .btn-sm {
            padding: 7px 12px; border-radius: 8px; border: none;
            font-size: 11px; font-weight: bold; cursor: pointer;
        }
        .btn-edit { background: #eab308; color: #000; }
        .btn-del { background: #ef4444; color: #fff; }
        .btn-copy {
            background: linear-gradient(135deg, var(--rose), #9f1239);
            color: #fff; padding: 14px; border-radius: 12px; border: 1px solid var(--gold);
            width: 100%; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- شاشة إدخال الرمز السري -->
    <div id="loginScreen">
        <i class="fa-solid fa-crown" style="font-size: 35px; color: var(--gold); margin-bottom: 10px;"></i>
        <h2>لوحة إدارة متجر الملوك</h2>
        <p style="font-size: 12px; color: #ccc; margin-top: 5px;">خاصة بالإدارة وتعديل الأسعار</p>
        <input type="password" id="passCode" class="pass-input" placeholder="أدخل الرمز السري">
        <button class="btn-gold" onclick="checkAuth()">دخول اللوحة</button>
    </div>

    <!-- واجهة التعديل والتحكم -->
    <div id="adminPanel">
        <div class="panel-header">
            <div>
                <h3>👑 لوحة تعديل المنتجات</h3>
                <span style="font-size: 11px; color: #ccc;">العدد الحالي: <b id="totalProds" style="color:var(--gold);">0</b> منتج</span>
            </div>
            <button onclick="logout()" style="background:none; border:1px solid #666; color:#fff; padding:5px 12px; border-radius:8px; cursor:pointer;">خروج</button>
        </div>

        <!-- صندوق إضافة منتج جديد -->
        <div class="add-box">
            <h4 style="color:var(--gold); margin-bottom: 12px; font-size: 14px;">➕ إضافة منتج جديد:</h4>
            <div class="form-row">
                <label>اسم المنتج:</label>
                <input type="text" id="newName" placeholder="مثال: قضيب واقعي سيليكون 23 سم">
            </div>
            <div style="display:flex; gap:10px;">
                <div class="form-row" style="flex:1;">
                    <label>السعر بالريال (ر.س):</label>
                    <input type="number" id="newPrice" placeholder="780">
                </div>
                <div class="form-row" style="flex:1;">
                    <label>القسم:</label>
                    <select id="newCat">
                        <option value="قضبان صناعية وواقعية">قضبان صناعية وواقعية</option>
                        <option value="أجهزة استمناء رجالية">أجهزة استمناء رجالية</option>
                        <option value="سدادات وخرز شرجي">سدادات وخرز شرجي</option>
                        <option value="ألعاب أزواج">ألعاب أزواج</option>
                        <option value="هزازات نسائية">هزازات نسائية</option>
                    </select>
                </div>
            </div>
            <button class="btn-gold" onclick="addNewProduct()" style="margin-top: 8px;">إضافة ونشر المنتج</button>
        </div>

        <!-- قائمة المنتجات الحالية -->
        <h4 style="margin-bottom: 12px; font-size: 14px;">📦 المنتجات الحالية (اضغط لتعديل السعر أو الحذف):</h4>
        <div id="productsList"></div>

        <!-- زر نسخ التعديلات -->
        <button class="btn-copy" onclick="copyCatalogCode()">
            <i class="fa-solid fa-copy"></i> نسخ كود المنتجات المحدث
        </button>
    </div>

    <script>
        // المنتجات الأساسية لمتجر الملوك
        let myProducts = JSON.parse(localStorage.getItem('admin_prods')) || [
            { id: 1, name: "مهبل صناعي هزاز فاخر 1000 نبضة", cat: "أجهزة استمناء رجالية", price: 650 },
            { id: 2, name: "جهاز استمناء شفط هيدروليك رويال X9", cat: "أجهزة استمناء رجالية", price: 1050 },
            { id: 3, name: "قضيب واقعي سيليكون طبي 23 سم رويال", cat: "قضبان صناعية وواقعية", price: 780 },
            { id: 4, name: "قضيب زجاجي كريستال ملكي للتبريد والتسخين", cat: "قضبان صناعية وواقعية", price: 1400 },
            { id: 5, name: "سدادة شرجية كريستال ملكية ذيل ثعلب", cat: "سدادات وخرز شرجي", price: 950 },
            { id: 6, name: "خرز شرجي متدرج 10 حبات سيليكون ملكي", cat: "سدادات وخرز شرجي", price: 1150 },
            { id: 7, name: "طقم ألعاب أزواج ملكي فاخر 12 قطعة", cat: "ألعاب أزواج", price: 990 },
            { id: 8, name: "لعبة كروت تحدي الأزواج ليلة العشاق", cat: "ألعاب أزواج", price: 650 },
            { id: 9, name: "هزاز الأرنب المزدوج رويال برو ماكس", cat: "هزازات نسائية", price: 890 },
            { id: 10, name: "هزاز G سبوت ذهبي فاخر 12 وضعية", cat: "هزازات نسائية", price: 1100 }
        ];

        function checkAuth() {
            const pass = document.getElementById("passCode").value;
            if (pass === "king123") {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                renderAdminList();
            } else {
                alert("رمز الدخول غير صحيح!");
            }
        }

        function logout() {
            document.getElementById("loginScreen").style.display = "block";
            document.getElementById("adminPanel").style.display = "none";
            document.getElementById("passCode").value = "";
        }

        function renderAdminList() {
            const list = document.getElementById("productsList");
            document.getElementById("totalProds").innerText = myProducts.length;

            list.innerHTML = myProducts.map((p, index) => `
                <div class="prod-item">
                    <div class="prod-info">
                        <div class="prod-name">${p.name}</div>
                        <div class="prod-price">${p.price} ر.س</div>
                        <div class="prod-cat">القسم: ${p.cat}</div>
                    </div>
                    <div class="action-btns">
                        <button class="btn-sm btn-edit" onclick="editPrice(${p.id})">✏️ السعر</button>
                        <button class="btn-sm btn-del" onclick="deleteProd(${p.id})">🗑️ حذف</button>
                    </div>
                </div>
            `).join("");
        }

        function editPrice(id) {
            const prod = myProducts.find(p => p.id === id);
            if (!prod) return;
            const newPrice = prompt(`تعديل سعر [${prod.name}]:`, prod.price);
            if (newPrice !== null && !isNaN(newPrice) && newPrice.trim() !== "") {
                prod.price = parseFloat(newPrice);
                saveData();
                renderAdminList();
                alert("تم تحديث السعر بنجاح!");
            }
        }

        function deleteProd(id) {
            if (confirm("هل تريد بالتأكيد حذف هذا المنتج؟")) {
                myProducts = myProducts.filter(p => p.id !== id);
                saveData();
                renderAdminList();
            }
        }

        function addNewProduct() {
            const name = document.getElementById("newName").value.trim();
            const price = parseFloat(document.getElementById("newPrice").value);
            const cat = document.getElementById("newCat").value;

            if (!name || isNaN(price)) {
                alert("يرجى كتابة اسم المنتج وسعره بشكل صحيح!");
                return;
            }

            const newId = Date.now();
            myProducts.unshift({ id: newId, name: name, cat: cat, price: price });
            saveData();

            document.getElementById("newName").value = "";
            document.getElementById("newPrice").value = "";
            renderAdminList();
            alert("تمت إضافة المنتج بنجاح!");
        }

        function saveData() {
            localStorage.setItem('admin_prods', JSON.stringify(myProducts));
        }

        function copyCatalogCode() {
            const code = JSON.stringify(myProducts, null, 2);
            navigator.clipboard.writeText(code).then(() => {
                alert("تم نسخ قائمة المنتجات المحدثة للحافظة بنجاح!");
            });
        }
    </script>
</body>
</html>
