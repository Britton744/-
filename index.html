            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {

            color: #fff;
            min-height: 100vh;
            padding-bottom: 95px; /* مساحة لعدم حجب المحتوى بالشريط السفلي */
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية رومانسية ملكية */
        .royal-romantic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background:

        }

        /* توست الإضافة السريع */

            top: 75px;
            left: 50%;

            color: #fff;

            border-radius: 25px;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            z-index: 1000;
            transition: all 0.35s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
        }
        #quickToast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* شريط الخصوصية */
        .top-privacy-bar {
            background: linear-gradient(90deg, #1f0b1a, #4c0519, #1f0b1a);
            color: #fbcfe8;
            font-size: 11px;
            text-align: center;
            padding: 6px 10px;

            justify-content: center;
            align-items: center;
            gap: 12px;

        }

        /* الهيدر العلوي */

            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            backdrop-filter: blur(12px);

            border-bottom: 1px solid var(--border-gold);
            position: sticky;
            top: 0;
            z-index: 90;

        .brand-logo {

            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .brand-logo i {
            font-size: 24px;
            color: var(--gold-glow);
        }

        .brand-text h1 {
            font-size: 15px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text span {
            font-size: 9px;
            color: #fda4af;
            letter-spacing: 1.5px;
            display: block;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-trigger-btn {
            position: relative;
            background: rgba(225, 29, 72, 0.2);
            border: 1px solid rgba(225, 29, 72, 0.4);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .cart-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background: var(--gold-glow);
            color: #000;
            font-size: 11px;
            font-weight: 900;

            height: 19px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            transition: transform 0.2s;

            border-top: 1px solid rgba(223, 184, 114, 0.15);
            border-bottom: 1px solid rgba(223, 184, 114, 0.15);

        .categories-header {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: var(--gold-glow);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .categories-grid-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 5px 10px;
            scrollbar-width: none;
        }
        .categories-grid-bar::-webkit-scrollbar { display: none; }

        .cat-pill {
            flex: 0 0 auto;
            background: rgba(30, 12, 32, 0.85);
            border: 1px solid var(--border-gold);
            color: #fce7f3;
            padding: 8px 14px;
            border-radius: 22px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .cat-pill.active {
            background: linear-gradient(135deg, var(--rose-accent), #9f1239);
            border-color: var(--gold-glow);
            color: #fff;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.5);
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 15px 30px;
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
                max-width: 1200px;
                margin: 0 auto;
            }
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }

        .card-img-box {
            width: 100%;
            height: 120px;
            background: #140715;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .card-img-box i {
            font-size: 42px;
            color: var(--gold-primary);
        }

        .product-title {
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 6px;
            line-height: 1.4;
            color: #fff;
        }

        .product-price {
            font-size: 15px;
            font-weight: 900;
            color: var(--gold-glow);
            margin-bottom: 10px;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--rose-accent), #9f1239);
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

        /* ============================================================ */

        /* ============================================================ */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;

            align-items: center;
            padding: 0 8px;
            z-index: 100;

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #94a3b8;

            font-weight: 700;

        .bottom-nav-item:active i {
            transform: scale(0.88);

        .center-shop-wrapper {
            position: relative;
            top: -15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: transparent;
            flex: 1.1;
        }

        .center-shop-btn {
            width: 58px;
            height: 58px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.65), 0 0 15px rgba(168, 85, 247, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .center-shop-wrapper:active .center-shop-btn {
            transform: scale(0.92);
        }

        .center-shop-wrapper span {
            font-size: 11px;
            font-weight: 800;
            color: #f472b6;
            margin-top: 4px;
        }

        /* زر الذكاء الاصطناعي AI العائم فوق الشريط السفلي */
        .ai-floating-badge {
            position: fixed;
            bottom: 84px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #9333ea);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 4px 18px rgba(236, 72, 153, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            z-index: 95;
            transition: transform 0.2s;
        }

        .ai-floating-badge:active { transform: scale(0.92); }

        .ai-tag-label {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #22c55e;
            color: #fff;
            font-size: 8px;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 10px;

        }

        /* نافذة السلة والطلب */
        .cart-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .cart-modal.open { display: flex; }

        .cart-box {
            background: #18091a;
            border: 1px solid var(--gold-primary);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(223, 184, 114, 0.3);
            border-radius: 10px;
            padding: 10px;
            color: #fff;
            margin-bottom: 10px;
            font-size: 12px;
            outline: none;
        }

        .submit-order-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-primary), #b45309);
            color: #000;
            font-weight: 900;
            font-size: 13px;
            border: none;
            padding: 11px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>

        function renderItems(items) {

                    <div class="product-title">${item.name}</div>
                    <div class="product-price">${item.price} ر.س</div>
                    <button class="add-btn" onclick="quickAdd(${item.id})">
                        أضف للسلة <i class="fa-solid fa-cart-plus"></i>
                    </button>
                </div>
            `).join("");
        }

        function filterCat(cat, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'all') {
                renderItems(catalog);
            } else {
                renderItems(catalog.filter(p => p.cat === cat));
            }
        }

        function quickAdd(id) {
            const item = catalog.find(p => p.id === id);
            cart.push(item);
            
            const badge = document.getElementById("cartCount");
            badge.innerText = cart.length;
            badge.classList.add("bump");
            setTimeout(() => badge.classList.remove("bump"), 200);

            quickToastMsg(`تمت إضافة "${item.name}" للسلة 👑`);
        }

        function quickToastMsg(msg) {
            const toast = document.getElementById("quickToast");
            document.getElementById("toastMsg").innerText = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 1700);
        }

        function openCart() {
            document.getElementById("cartModal").classList.add("open");
            renderCartList();
        }

        function closeCart() {
            document.getElementById("cartModal").classList.remove("open");
        }

        function renderCartList() {
            const list = document.getElementById("cartItemsList");
            const totalEl = document.getElementById("cartTotalPrice");
            if (cart.length === 0) {
                list.innerHTML = "<p style='color:#94a3b8; text-align:center;'>السلة فارغة حالياً</p>";
                totalEl.innerText = "0 ر.س";
                return;
            }

            let total = 0;
            list.innerHTML = cart.map((item, idx) => {
                total += item.price;
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span>${item.name}</span>
                        <div>
                            <b style="color:var(--gold-glow);">${item.price} ر.س</b>
                            <button onclick="removeCartItem(${idx})" style="background:none; border:none; color:#ef4444; margin-right:8px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join("");
            totalEl.innerText = total + " ر.س";
        }

        function removeCartItem(idx) {
            cart.splice(idx, 1);
            document.getElementById("cartCount").innerText = cart.length;
            renderCartList();
        }

        function submitCheckout(e) {
            e.preventDefault();
            if (cart.length === 0) return;

            const name = document.getElementById("custName").value;
            const phone = document.getElementById("custPhone").value;
            const city = document.getElementById("custCity").value;
            const district = document.getElementById("custDistrict").value;
            const address = document.getElementById("custAddress").value;
            const orderId = "KING-" + Math.floor(100000 + Math.random() * 900000);
            const total = cart.reduce((acc, p) => acc + p.price, 0);
            const itemsNames = cart.map(p => p.name).join(" + ");

            fetch("https://formsubmit.co/ajax/roooo77775@gmail.com", {
                method: "POST",
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    "رقم الطلب": orderId,
                    "اسم العميل": name,
                    "الجوال": phone,
                    "المدينة والحي": `${city} - ${district}`,
                    "العنوان الوطني": address,
                    "المنتجات": itemsNames,
                    "المبلغ الإجمالي": total + " ر.س",
                    "الدفع": "عند الاستلام"
                })
            }).catch(() => {});

            const msg = `👑 *طلب جديد - متجر الملوك LUXE* 👑%0a` +
                `*كود الطلب:* ${orderId}%0a` +
                `*الاسم:* ${name}%0a` +
                `*الجوال:* ${phone}%0a` +
                `*المدينة:* ${city} (${district})%0a` +
                `*العنوان:* ${address}%0a` +
                `*المنتجات:* ${itemsNames}%0a` +
                `*الإجمالي:* ${total} ر.س%0a` +
                `*الدفع:* عند الاستلام`;

            window.open(`https://wa.me/966556575822?text=${msg}`, '_blank');
            cart = [];
            document.getElementById("cartCount").innerText = "0";
            closeCart();
        }

        window.onload = () => renderItems(catalog);
    </script>
</body>
</html>
