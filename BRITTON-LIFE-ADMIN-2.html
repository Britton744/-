<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRITTON LIFE — لوحة التحكم</title>
<style>
:root{--bg:#09051d;--panel:#171039;--line:#57336d;--pink:#df35b0;--gold:#e8b7f1;--muted:#c6b9d6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#252b83,transparent 35%),var(--bg);color:#fff;font-family:Arial,Tahoma,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:20px;background:#0c0820;border-left:1px solid var(--line)}.brand{text-align:center;color:var(--gold);font-size:23px;font-weight:bold;margin:10px 0 25px}.brand img{display:block;width:75px;height:75px;object-fit:contain;margin:auto auto 8px}.nav button{display:block;width:100%;text-align:right;background:none;color:#fff;border:0;padding:13px;border-radius:10px;margin:4px 0}.nav button.active,.nav button:hover{background:#34205a}.main{padding:22px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.card{background:linear-gradient(145deg,#21184c,#100b2d);border:1px solid var(--line);border-radius:16px;padding:17px;margin:14px 0}.btn{border:1px solid var(--line);background:#171039;color:#fff;padding:10px 14px;border-radius:10px}.primary{background:linear-gradient(120deg,#3d55ed,#9236e7,#df35b0);border:0;font-weight:bold}.danger{color:#ff9eae}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat b{display:block;color:var(--gold);font-size:25px;margin-top:8px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#090621;color:#fff}.field textarea{min-height:100px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.table{overflow:auto}.item{display:grid;grid-template-columns:60px 1fr 100px 160px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-width:550px}.thumb{width:55px;height:55px;object-fit:cover;border-radius:9px;background:#251b42}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview img{width:90px;height:75px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}.modalbox{background:#171039;border:1px solid var(--pink);border-radius:18px;padding:20px;width:min(760px,100%);max-height:94vh;overflow:auto}.toast{position:fixed;bottom:15px;left:15px;background:#241342;border:1px solid var(--gold);padding:12px;border-radius:10px;display:none;z-index:8}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{padding:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.main{padding:12px}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><div class="layout">
<aside class="side"><div class="brand"><img id="brandLogo" class="hidden" alt="شعار">BRITTON LIFE<div class="muted">MASTER CONTROL</div></div>
<nav class="nav"><button class="active" data-page="dashboard">⌂ الرئيسية</button><button data-page="products">▣ المنتجات</button><button data-page="categories">▦ الأقسام</button><button data-page="orders">🛒 الطلبات</button><button data-page="settings">⚙ الإعدادات</button></nav>
<a class="btn primary" style="display:block;text-align:center;text-decoration:none;margin-top:16px" href="https://britton744.github.io/-/" target="_blank" rel="noopener">↗ فتح المتجر</a>
<button class="btn" style="width:100%;margin-top:9px" onclick="logout()">تسجيل الخروج</button>
<p class="muted">حفظ البيانات والصور عبر Firebase الحالي.</p></aside>
<main class="main"><header class="top"><div><h1 id="title">مركز التحكم</h1><p class="muted">إدارة منتجات وأقسام BRITTON LIFE</p></div><button class="btn primary" onclick="openProduct()">＋ إضافة منتج</button></header>
<section id="dashboard"><div class="stats"><div class="card stat">المنتجات<b id="countP">0</b></div><div class="card stat">الأقسام<b id="countC">0</b></div><div class="card stat">الطلبات<b id="countO">0</b></div></div><div class="card"><h3>حالة الاتصال</h3><div id="connection" class="muted">جاري الاتصال...</div><button class="btn" onclick="testConnection()">اختبار الاتصال</button></div><div class="card"><h3>آخر الطلبات</h3><div id="recent"></div></div></section>
<section id="products" class="hidden"><div class="card"><div class="top"><h2>المنتجات</h2><input id="search" placeholder="ابحث عن منتج" oninput="renderProducts()"><button class="btn primary" onclick="openProduct()">＋ منتج</button></div><div id="productList" class="table"></div></div></section>
<section id="categories" class="hidden"><div class="card"><div class="top"><h2>الأقسام</h2><button class="btn primary" onclick="openCategory()">＋ قسم</button></div><div id="categoryList"></div></div></section>
<section id="orders" class="hidden"><div class="card"><h2>الطلبات</h2><div id="orderList"></div></div></section>
<section id="settings" class="hidden"><div class="card"><h2>إعدادات المتجر</h2><div class="grid"><div class="field"><label>شعار المتجر</label><input id="logoFile" type="file" accept="image/*"><div id="logoPreview" class="preview"></div></div><div class="field"><label>اسم المتجر</label><input id="storeName" value="BRITTON LIFE"></div><div class="field"><label>رقم التواصل</label><input id="storePhone"></div><div class="field"><label>البريد الإلكتروني</label><input id="storeEmail" type="email"></div></div><button class="btn primary" onclick="saveSettings()">حفظ الإعدادات</button></div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="top"><h2 id="modalTitle">إضافة</h2><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import{getFirestore,collection,doc,getDocs,getDoc,addDoc,updateDoc,deleteDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";
const config={apiKey:"AIzaSyBPdzepkO8xNsfZuwvheHrhA6LynGJBctk_E",authDomain:"britton-life-store.firebaseapp.com",projectId:"britton-life-store",storageBucket:"britton-life-store.firebasestorage.app",messagingSenderId:"258780754601",appId:"1:258780754601:web:5c0d162547e64bd99d2fb8",measurementId:"G-RXK7K2Z4YT"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app),$=id=>document.getElementById(id);
let user=null,products=[],categories=[],orders=[];
const msg=t=>{let x=$("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",3200)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const err=e=>e?.code==="permission-denied"?"الصلاحيات تمنع العملية؛ راجع قواعد Firebase.":e?.code==="storage/unauthorized"?"رفع الصور ممنوع في Storage Rules.":e?.code?.startsWith("auth/")?"تعذر تسجيل الدخول؛ تحقق من البريد وكلمة المرور.":e.message||"حدث خطأ";
async function upload(file,folder){if(!file)return"";if(!file.type.startsWith("image/"))throw Error("اختر صورة");if(file.size>8*1024*1024)throw Error("حجم الصورة أكبر من 8 ميجابايت");let r=ref(storage,folder+"/"+crypto.randomUUID()+"-"+file.name.replace(/[^\w.\-]/g,"_"));await uploadBytes(r,file);return getDownloadURL(r)}
function login(){if($("loginBox"))return;let d=document.createElement("div");d.id="loginBox";d.className="modal";d.innerHTML=`<div class="modalbox" style="max-width:420px"><h2>دخول المدير</h2><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password"></div><button class="btn primary" id="loginBtn">دخول</button><p id="loginMsg" class="muted"></p></div>`;document.body.append(d);$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value);d.remove()}catch(e){$("loginMsg").textContent=err(e)}}}
window.logout=()=>signOut(auth).then(()=>location.reload());
onAuthStateChanged(auth,async u=>{user=u;if(!u){login();$("connection").textContent="بانتظار تسجيل دخول المدير";return} $("loginBox")?.remove();$("connection").textContent="تم تسجيل الدخول إلى Firebase";await loadAll()});
async function read(name){let s=await getDocs(collection(db,name));return s.docs.map(d=>({id:d.id,...d.data()}))}
async function loadAll(){try{[products,categories,orders]=await Promise.all([read("products"),read("categories"),read("orders")]);$("countP").textContent=products.length;$("countC").textContent=categories.length;$("countO").textContent=orders.length;renderProducts();renderCategories();renderOrders();$("recent").innerHTML=orders.slice(-5).reverse().map(o=>`<p>${esc(o.customer_name||o.name||"عميل")} — ${Number(o.total||0)} ر.س</p>`).join("")||"لا توجد طلبات";await loadSettings()}catch(e){$("connection").textContent="تعذر التحميل: "+err(e)}}
function images(p){return Array.isArray(p.images)?p.images.slice(0,3):(p.image_url?[p.image_url]:[])}
function categoryName(id){return categories.find(c=>c.id===id)?.name||id||"بدون قسم"}
function renderProducts(){let q=($("search")?.value||"").toLowerCase();$("productList").innerHTML=products.filter(p=>(p.name||"").toLowerCase().includes(q)).map(p=>`<div class="item"><img class="thumb" src="${esc(images(p)[0]||"")}" alt=""><div><b>${esc(p.name)}</b><div class="muted">${esc(p.description||"").slice(0,80)} · ${images(p).length}/3 صور</div></div><div>${Number(p.price||0)} ر.س</div><div><button class="btn" onclick="openProduct('${p.id}')">تعديل</button> <button class="btn danger" onclick="deleteProduct('${p.id}')">حذف</button></div></div>`).join("")||"لا توجد منتجات"}
function renderCategories(){$("categoryList").innerHTML=categories.map(c=>`<div class="item"><span>▦</span><b>${esc(c.name)}</b><span></span><button class="btn danger" onclick="deleteCategory('${c.id}')">حذف</button></div>`).join("")||"لا توجد أقسام"}
function renderOrders(){$("orderList").innerHTML=orders.map(o=>`<div class="item"><span>#${esc(o.id)}</span><div>${esc(o.customer_name||o.name||"عميل")}<div class="muted">${esc(o.phone||"")}</div></div><span>${Number(o.total||0)} ر.س</span><select onchange="updateOrder('${o.id}',this.value)"><option ${o.status==="جديد"?"selected":""}>جديد</option><option ${o.status==="قيد التجهيز"?"selected":""}>قيد التجهيز</option><option ${o.status==="تم الشحن"?"selected":""}>تم الشحن</option><option ${o.status==="مكتمل"?"selected":""}>مكتمل</option><option ${o.status==="ملغي"?"selected":""}>ملغي</option></select></div>`).join("")||"لا توجد طلبات"}
window.openProduct=id=>{let p=id?products.find(x=>x.id===id):null,old=images(p||{});$("modalTitle").textContent=p?"تعديل المنتج":"إضافة منتج";$("modalBody").innerHTML=`<input id="pId" type="hidden" value="${p?.id||""}"><div class="grid"><div class="field"><label>اسم المنتج</label><input id="pName" value="${esc(p?.name||"")}"></div><div class="field"><label>السعر (ر.س)</label><input id="pPrice" type="number" min="0" step=".01" value="${p?.price??""}"></div><div class="field"><label>المخزون</label><input id="pStock" type="number" min="0" value="${p?.stock??0}"></div><div class="field"><label>القسم</label><select id="pCategory">${categories.map(c=>`<option value="${c.id}" ${p?.categoryId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div><div class="field full"><label>وصف المنتج</label><textarea id="pDesc">${esc(p?.description||"")}</textarea></div><div class="field full"><label>صور المنتج: 3 صور كحد أقصى (الرئيسية + صورتان إضافيتان)</label><input id="pFiles" type="file" accept="image/*" multiple><div class="muted">اترك الاختيار فارغاً للاحتفاظ بالصور الحالية. اختيار صور جديدة يستبدل القديمة.</div><div id="previews" class="preview">${old.map((u,i)=>`<img src="${esc(u)}" alt="صورة ${i+1}">`).join("")}</div><input id="oldImages" type="hidden" value="${esc(JSON.stringify(old))}"></div><div class="field"><label>الحالة</label><select id="pActive"><option value="true" ${p?.active!==false?"selected":""}>مفعل</option><option value="false" ${p?.active===false?"selected":""}>مخفي</option></select></div></div><button class="btn primary" onclick="saveProduct()">حفظ المنتج</button>`;$("modal").classList.remove("hidden")};
$("modal").addEventListener("change",e=>{if(e.target.id==="pFiles"){let fs=[...e.target.files];if(fs.length>3){msg("مسموح بثلاث صور فقط");e.target.value="";return}$("previews").innerHTML=fs.map((f,i)=>`<img src="${URL.createObjectURL(f)}" alt="صورة ${i+1}">`).join("")}});
window.saveProduct=async()=>{try{let name=$("pName").value.trim(),files=[...$("pFiles").files];if(!name)return msg("اكتب اسم المنتج");if(!categories.length)return msg("أضف قسماً أولاً");if(files.length>3)return msg("الحد الأقصى 3 صور");let imgs=files.length?[]:JSON.parse($("oldImages").value||"[]");for(let f of files)imgs.push(await upload(f,"products"));imgs=imgs.slice(0,3);let cid=$("pCategory").value,cat=categories.find(c=>c.id===cid),data={name,price:Number($("pPrice").value||0),stock:Number($("pStock").value||0),categoryId:cid,category:cat?.slug||cat?.name||"",categoryName:cat?.name||"",description:$("pDesc").value.trim(),images:imgs,image_url:imgs[0]||"",active:$("pActive").value==="true",updatedAt:new Date()};let id=$("pId").value;if(id)await updateDoc(doc(db,"products",id),data);else await addDoc(collection(db,"products"),{...data,createdAt:new Date()});msg("تم حفظ المنتج");closeModal();await loadAll()}catch(e){msg(err(e))}};
window.deleteProduct=async id=>{if(confirm("حذف المنتج؟"))try{await deleteDoc(doc(db,"products",id));await loadAll();msg("تم الحذف")}catch(e){msg(err(e))}};
window.openCategory=()=>{$("modalTitle").textContent="إضافة قسم";$("modalBody").innerHTML=`<div class="field"><label>اسم القسم</label><input id="cName"></div><div class="field"><label>الرابط المختصر (اختياري)</label><input id="cSlug"></div><button class="btn primary" onclick="saveCategory()">حفظ القسم</button>`;$("modal").classList.remove("hidden")};
window.saveCategory=async()=>{try{let name=$("cName").value.trim();if(!name)return msg("اكتب اسم القسم");let slug=$("cSlug").value.trim()||name;await addDoc(collection(db,"categories"),{name,slug,active:true,createdAt:new Date()});closeModal();await loadAll();msg("تم حفظ القسم")}catch(e){msg(err(e))}};
window.deleteCategory=async id=>{if(confirm("حذف القسم؟"))try{await deleteDoc(doc(db,"categories",id));await loadAll()}catch(e){msg(err(e))}};
window.updateOrder=async(id,status)=>{try{await updateDoc(doc(db,"orders",id),{status,updatedAt:new Date()});await loadAll();msg("تم تحديث الطلب")}catch(e){msg(err(e))}};
async function loadSettings(){try{let s=await getDoc(doc(db,"settings","store"));if(!s.exists())return;let x=s.data();$("storeName").value=x.name||"BRITTON LIFE";$("storePhone").value=x.phone||"";$("storeEmail").value=x.email||"";if(x.logo){$("brandLogo").src=x.logo;$("brandLogo").classList.remove("hidden");$("logoPreview").innerHTML=`<img src="${esc(x.logo)}" alt="الشعار الحالي">`}}catch(e){}}
window.saveSettings=async()=>{try{let prev=(await getDoc(doc(db,"settings","store"))).data()||{},f=$("logoFile").files[0],logo=f?await upload(f,"settings"):prev.logo||"";await setDoc(doc(db,"settings","store"),{name:$("storeName").value.trim(),phone:$("storePhone").value.trim(),email:$("storeEmail").value.trim(),logo,updatedAt:new Date()},{merge:true});await loadSettings();msg("تم حفظ الإعدادات")}catch(e){msg(err(e))}};
window.testConnection=async()=>{try{let r=await addDoc(collection(db,"adminTests"),{at:new Date(),uid:user.uid});await deleteDoc(r);msg("الاتصال والكتابة يعملان ✓")}catch(e){msg(err(e))}};
window.closeModal=()=>$("modal").classList.add("hidden");
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));$(b.dataset.page).classList.remove("hidden");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b));$("title").textContent=b.textContent});
</script></body></html>
