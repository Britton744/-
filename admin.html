<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم المستقلة | بريتون لايف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37;
            --bg-dark: #080509;
            --card-bg: #140E19;
            --card-border: #2B1829;
            --text-light: #F5F5F7;
            --text-muted: #A397A6;
            --danger: #E03E3E;
            --radius-md: 12px;
            --radius-lg: 18px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 14px; margin-bottom: 20px; }
        .header h1 { font-size: 1.3rem; color: var(--gold); }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 20px; }
        .card h3 { font-size: 1rem; color: var(--gold); margin-bottom: 12px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .input-control { width: 100%; background: #0A060C; border: 1px solid var(--card-border); padding: 10px; border-radius: var(--radius-md); color: white; outline: none; }
        .btn { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: var(--radius-md); font-weight: 800; width: 100%; cursor: pointer; margin-top: 6px; }
        .prod-item { display: flex; justify-content: space-between; align-items: center; background: #1C1322; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .del-btn { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-crown"></i> لوحة التحكم المستقلة</h1>
            <a href="https://ten-sigma-61.vercel.app/" target="_blank" style="color:var(--text-muted); text-decoration:none; font-size:0.85rem;">عرض المتجر</a>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-plus-circle"></i> إضافة منتج جديد إلى المتجر</h3>
            <div class="form-group"><label>اسم المنتج</label><input type="text" id="pName" class="input-control" placeholder="اسم المنتج"></div>
            <div class="form-group">
                <label>القسم</label>
                <select id="pCat" class="input-control">
                    <option value="oils">زيوت ومنشطات</option>
                    <option value="accessories">أدوات وملحقات</option>
                    <option value="care">العناية والجلاد</option>
                    <option value="vibrators">الاهتزازات</option>
                    <option value="masturbator">المهبل الاصطناعي</option>
                    <option value="dildo">القضبان الاصطناعية</option>
                    <option value="games">الألعاب الزوجية</option>
                    <option value="featured">منتجات مميزة</option>
                </select>
            </div>
            <div class="form-group"><label>السعر (ر.س)</label><input type="number" id="pPrice" class="input-control" placeholder="199"></div>
            <div class="form-group"><label>وصف مقتضب</label><input type="text" id="pSub" class="input-control" placeholder="تغليف سري ومميز"></div>
            <div class="form-group"><label>رابط الصورة المباشر</label><input type="url" id="pImg" class="input-control" placeholder="https://..."></div>
            <button class="btn" onclick="saveProduct()">+ حفظ ونشر المنتج</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-boxes-stacked"></i> المنتجات الحالية بالمتجر</h3>
            <div id="itemsList"></div>
        </div>
    </div>

    <script>
        const originalProducts = [
            { id: 1, name: "زيت التزليق", subtitle: "مائي وآمن على البشرة", category: "oils", price: 89, image: "https://images.unsplash.com/photo-1608248597359-bb4f4693a1cf?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "حلقة تأخير القذف", subtitle: "سيليكون مريح وقابل للتعديل", category: "accessories", price: 159, image: "https://images.unsplash.com/photo-1596433809252-260c2745dfdd?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "كرات كيجيل", subtitle: "لتقوية العضلات وتحسين المتعة", category: "care", price: 199, image: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=600&q=80" },
            { id: 4, name: "هزاز أرنب", subtitle: "10 سرعات - شحن USB", category: "vibrators", price: 249, image: "https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=600&q=80" },
            { id: 5, name: "مهبل صناعي واقعي", subtitle: "ملمس ناعم - تصميم واقعي", category: "masturbator", price: 1000, image: "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=600&q=80" },
            { id: 6, name: "قضيب صناعي واقعي", subtitle: "سيليكون طبي - مع قاعدة تثبيت", category: "dildo", price: 1100, image: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=600&q=80" },
            { id: 7, name: "لعبة كروت التحدي الرومانسية", subtitle: "مستويات إثارة وغموض خاصة VIP", category: "games", price: 139, image: "https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?auto=format&fit=crop&w=600&q=80" }
        ];

        let prods = JSON.parse(localStorage.getItem('briton_store_products_v3')) || originalProducts;

        function render() {
            document.getElementById('itemsList').innerHTML = prods.map((p, idx) => `
                <div class="prod-item">
                    <div>
                        <div style="font-weight:700; font-size:0.9rem;">${p.name}</div>
                        <div style="color:var(--gold); font-size:0.8rem;">${p.price} ر.س</div>
                    </div>
                    <button class="del-btn" onclick="del(${idx})">حذف</button>
                </div>
            `).join('');
        }

        function saveProduct() {
            const name = document.getElementById('pName').value.trim();
            const category = document.getElementById('pCat').value;
            const price = parseFloat(document.getElementById('pPrice').value);
            const subtitle = document.getElementById('pSub').value.trim() || "تغليف سري ومميز";
            const image = document.getElementById('pImg').value.trim() || "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=600&q=80";

            if (!name || isNaN(price)) return alert("يرجى كتابة الاسم والسعر");

            prods.unshift({ id: Date.now(), name, subtitle, category, price, image });
            localStorage.setItem('briton_store_products_v3', JSON.stringify(prods));
            render();

            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pSub').value = '';
            document.getElementById('pImg').value = '';
            alert("✅ تم إضافة المنتج بنجاح!");
        }

        function del(idx) {
            if(confirm("حذف هذا المنتج؟")) {
                prods.splice(idx, 1);
                localStorage.setItem('briton_store_products_v3', JSON.stringify(prods));
                render();
            }
        }

        window.onload = render;
    </script>
</body>
</html>
