<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم متجر الملوك</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #09030b; color: #fff; padding: 20px; text-align: center; }
        .box { max-width: 400px; margin: 50px auto; background: #160818; padding: 25px; border-radius: 15px; border: 1px solid #dfb872; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #dfb872; background: #000; color: #fff; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 12px; background: #dfb872; color: #000; font-weight: bold; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 5px; }
        .item { background: #220b26; border: 1px solid #444; border-radius: 8px; padding: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; text-align: right; }
        .btn-sm { width: auto; padding: 6px 12px; margin: 0 2px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- 1. شاشة الدخول المباشرة -->
    <div id="loginBox" class="box">
        <h2 style="color:#dfb872; margin-bottom:15px;">👑 لوحة تحكم متجر الملوك</h2>
        <p style="font-size:13px; color:#ccc;">أدخل الرمز السري:</p>
        <input type="text" id="myPass" placeholder="اكتب king123">
        <button onclick="loginNow()">تسجيل الدخول</button>
        <p id="err" style="color:red; display:none; margin-top:10px;">الرمز غير صحيح!</p>
    </div>

    <!-- 2. محتوى لوحة التحكم وتعديل الأسعار -->
    <div id="panelBox" style="display:none; max-width:600px; margin:0 auto;">
        <h2 style="color:#dfb872;">👑 إدارة المنتجات والأسعار</h2>
        
        <div class="box" style="margin:20px 0; text-align:right;">
            <h3 style="color:#dfb872; margin-bottom:10px;">➕ إضافة منتج جديد:</h3>
            <input type="text" id="pName" placeholder="اسم المنتج">
            <input type="number" id="pPrice" placeholder="السعر بالريال">
            <select id="pCat">
                <option value="men">أجهزة رجالية</option>
                <option value="dildo">قضبان صناعية</option>
                <option value="anal">سدادات وخرز</option>
                <option value="couples">ألعاب أزواج</option>
                <option value="vibe">هزازات نسائية</option>
            </select>
            <button onclick="addProduct()" style="background:#22c55e; color:#fff;">نشر المنتج فوراً</button>
        </div>

        <h3 style="text-align:right; margin-top:20px;">المنتجات الحالية:</h3>
        <div id="prodsList"></div>
    </div>

    <script>
        const defaultList = [
            { id: 1, name: "مهبل صناعي هزاز فاخر 1000 نبضة", price: 650 },
            { id: 2, name: "جهاز استمناء شفط هيدروليك رويال X9", price: 1050 },
            { id: 3, name: "قضيب واقعي سيليكون طبي 23 سم رويال", price: 780 },
            { id: 4, name: "قضيب زجاجي كريستال ملكي للتبريد والتسخين", price: 1400 },
            { id: 5, name: "سدادة شرجية كريستال ملكية ذيل ثعلب", price: 950 },
            { id: 6, name: "خرز شرجي متدرج 10 حبات سيليكون ملكي", price: 1150 },
            { id: 7, name: "طقم ألعاب أزواج ملكي فاخر 12 قطعة", price: 990 },
            { id: 8, name: "لعبة كروت تحدي الأزواج ليلة العشاق", price: 650 },
            { id: 9, name: "هزاز الأرنب المزدوج رويال برو ماكس", price: 890 },
            { id: 10, name: "هزاز G سبوت ذهبي فاخر 12 وضعية", price: 1100 }
        ];

        let prods = JSON.parse(localStorage.getItem('luxe_catalog')) || defaultList;

        // دالة الدخول الفوري بدون أي أخطاء
        function loginNow() {
            var val = document.getElementById("myPass").value.trim().toLowerCase();
            if (val === "king123") {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("panelBox").style.display = "block";
                drawList();
            } else {
                document.getElementById("err").style.display = "block";
            }
        }

        function drawList() {
            var container = document.getElementById("prodsList");
            container.innerHTML = "";
            for (var i = 0; i < prods.length; i++) {
                (function(item) {
                    var div = document.createElement("div");
                    div.className = "item";
                    div.innerHTML = "<div><b>" + item.name + "</b><br><span style='color:#dfb872;'>" + item.price + " ر.س</span></div>" +
                        "<div>" +
                        "<button class='btn-sm' style='background:#eab308; color:#000;' onclick='editPrice(" + item.id + ")'>تعديل السعر</button>" +
                        "<button class='btn-sm' style='background:#ef4444; color:#fff;' onclick='delItem(" + item.id + ")'>حذف</button>" +
                        "</div>";
                    container.appendChild(div);
                })(prods[i]);
            }
        }

        function editPrice(id) {
            var item = prods.find(function(p) { return p.id === id; });
            var p = prompt("أدخل السعر الجديد لـ " + item.name, item.price);
            if (p) {
                item.price = Number(p);
                localStorage.setItem('luxe_catalog', JSON.stringify(prods));
                drawList();
            }
        }

        function delItem(id) {
            if (confirm("هل تريد حذف المنتج؟")) {
                prods = prods.filter(function(p) { return p.id !== id; });
                localStorage.setItem('luxe_catalog', JSON.stringify(prods));
                drawList();
            }
        }

        function addProduct() {
            var n = document.getElementById("pName").value.trim();
            var pr = document.getElementById("pPrice").value;
            var c = document.getElementById("pCat").value;
            if (!n || !pr) { alert("أدخل البيانات كاملة"); return; }
            prods.unshift({ id: Date.now(), name: n, price: Number(pr), cat: c });
            localStorage.setItem('luxe_catalog', JSON.stringify(prods));
            document.getElementById("pName").value = "";
            document.getElementById("pPrice").value = "";
            drawList();
            alert("تمت الإضافة بنجاح!");
        }
    </script>
</body>
</html>
