<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم الملكية المطورة | متجر الملوك LUXE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #dfb872;
            --gold-glow: #ffd700;
            --rose: #e11d48;
            --bg: #09030b;
            --card: #150617;
            --card-hover: #1e0921;
            --border: rgba(223, 184, 114, 0.25);
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: #fff; min-height: 100vh; padding-bottom: 50px; }

        /* شاشة تسجيل الدخول */
        #loginScreen {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-box {
            background: var(--card); border: 1px solid var(--gold); border-radius: 20px;
            padding: 30px 20px; width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .login-icon { font-size: 45px; color: var(--gold-glow); margin-bottom: 15px; }

        /* اللوحة الرئيسية */
        .admin-wrap { max-width: 900px; margin: 0 auto; padding: 15px; display: none; }
        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background: var(--card); border-radius: 16px; border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .admin-title { display: flex; align-items: center; gap: 10px; }
        .admin-title i { font-size: 24px; color: var(--gold-glow); }

        /* بطاقات الإحصائيات */
        .stats-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;
        }
        @media(min-width: 600px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
        .stat-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            padding: 14px; text-align: center;
        }
        .stat-card .val { font-size: 20px; font-weight: 900; color: var(--gold-glow); margin-top: 4px; }
        .stat-card .lbl { font-size: 11px; color: #fda4af; }

        /* الأزرار والحقول */
        .section-box {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 18px; margin-bottom: 20px;
        }
        .section-box h3 { font-size: 15px; color: var(--gold); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 11px; color: #fce7f3; margin-bottom: 5px; font-weight: bold; }
        .input-field, .select-field, .textarea-field {
            width: 100%; background: #0c020e; border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 12px; color: #fff; font-size: 13px; outline: none; transition: 0.2s;
        }
        .input-field:focus, .select-field:focus, .textarea-field:focus { border-color: var(--gold-glow); }
        .textarea-field { height: 80px; resize: none; }

        .btn-main {
            width: 100%; background: linear-gradient(135deg, var(--rose), #9f1239);
            color: #fff; font-weight: 800; padding: 12px; border-radius: 10px; border: none;
            cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #b45309); color: #000;
        }

        /* قائمة المنتجات المحفوظة */
        .prod-item {
            background: #0f0312; border: 1px solid var(--border); border-radius: 14px;
            padding: 12px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center;
        }
        .prod-thumb {
            width: 65px; height: 65px; border-radius: 10px; object-fit: cover; background: #000; flex-shrink: 0;
            border: 1px solid rgba(223, 184, 114, 0.3);
        }
        .prod-info { flex-grow: 1; min-width: 0; }
        .prod-info h4 { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prod-info .cat-tag { font-size: 10px; color: #fda4af; }
        .prod-info .price-tag { font-size: 13px; font-weight: 900; color: var(--gold-glow); margin-top: 3px; }

        .prod-actions { display: flex; flex-direction: column; gap: 6px; }
        .btn-act {
            border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;
            font-weight: bold; display: flex; align-items: center; gap: 4px;
        }
        .btn-edit { background: #3b82f6; color: #fff; }
        .btn-del { background: var(--danger); color: #fff; }

        .top-action-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .top-btn {
            flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
            background: #19051d; color: #fce7f3; font-size: 12px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
        }
    </style>
</head>

        function verifyAdmin() {
            const pass = document.getElementById('passCode').value;

            const price = parseInt(document.getElementById('pPrice').value);
            const img1 = document.getElementById('pImg1').value.trim();
            const img2 = document.getElementById('pImg2').value.trim();
            const img3 = document.getElementById('pImg3').value.trim();
            const desc = document.getElementById('pDesc').value.trim();

            const imgs = [img1];
            if (img2) imgs.push(img2);
            if (img3) imgs.push(img3);

            if (editIdx >= 0) {
                catalog[editIdx].name = name;
                catalog[editIdx].cat = cat;
                catalog[editIdx].price = price;
                catalog[editIdx].imgs = imgs;
                catalog[editIdx].desc = desc;
                alert('تم تحديث المنتج بنجاح 👑!');
            } else {
                const newId = catalog.length > 0 ? Math.max(...catalog.map(p => p.id || 0)) + 1 : 1;
                catalog.unshift({
                    id: newId,
                    name: name,
                    cat: cat,
                    price: price,
                    imgs: imgs,
                    desc: desc
                });
                alert('تمت إضافة المنتج الجديد بنجاح إلى المتجر 🎉!');
            }

            localStorage.setItem('luxe_catalog', JSON.stringify(catalog));
            resetAdminForm();
            renderAdminList();
        }

        function editProduct(index) {
            const p = catalog[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('pName').value = p.name;
            document.getElementById('pCat').value = p.cat;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pImg1').value = (p.imgs && p.imgs[0]) ? p.imgs[0] : (p.img || '');
            document.getElementById('pImg2').value = (p.imgs && p.imgs[1]) ? p.imgs[1] : '';
            document.getElementById('pImg3').value = (p.imgs && p.imgs[2]) ? p.imgs[2] : '';
            document.getElementById('pDesc').value = p.desc || '';

            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> تعديل المنتج';
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-check"></i> حفظ التعديلات';
            document.getElementById('cancelBtn').style.display = 'block';

            window.scrollTo({ top: 120, behavior: 'smooth' });
        }

        function resetAdminForm() {
            document.getElementById('prodForm').reset();
            document.getElementById('editIndex').value = '-1';
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-square-plus"></i> إضافة منتج جديد';
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-check"></i> حفظ ونشر المنتج';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function deleteProduct(index) {
            if (confirm(`هل أنت متأكد من حذف المنتج: "${catalog[index].name}"؟`)) {
                catalog.splice(index, 1);
                localStorage.setItem('luxe_catalog', JSON.stringify(catalog));
                renderAdminList();
            }
        }

        function restoreDefaults() {
            if (confirm('هل ترغب حقاً في استعادة المنتجات الأساسية الـ 10 الأصلية؟')) {
                catalog = [...defaultCatalog];
                localStorage.setItem('luxe_catalog', JSON.stringify(catalog));
                renderAdminList();
                alert('تمت استعادة المنتجات الأساسية بنجاح 👑!');
            }
        }
    </script>
</body>
</html>
