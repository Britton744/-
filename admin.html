<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | متجر الملوك</title>
    <style>
        body { background: #09030b; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; direction: rtl; }
        .box { background: #150617; border: 1px solid #dfb872; max-width: 400px; margin: 40px auto; padding: 25px; border-radius: 15px; }
        input, select, textarea { width: 90%; padding: 10px; margin: 8px 0; background: #000; border: 1px solid #dfb872; color: #fff; border-radius: 8px; }
        button { background: #dfb872; color: #000; font-weight: bold; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 95%; }
        .item { background: #1e0921; border: 1px solid rgba(223,184,114,0.3); padding: 10px; margin: 10px 0; border-radius: 8px; text-align: right; }
    </style>
</head>
<body>

    <div id="login" class="box">
        <h2 style="color:#dfb872;">👑 لوحة تحكم الملوك</h2>
        <p>أدخل كلمة المرور:</p>
        <input type="password" id="pass" placeholder="كلمة المرور">
        <button onclick="checkPass()">دخول</button>
        <p id="err" style="color:red; display:none;">كلمة المرور خاطئة!</p>
    </div>

    <div id="panel" style="display:none; max-width:600px; margin:auto;">
        <h2 style="color:#dfb872;">إدارة متجر الملوك</h2>
        <div class="box">
            <h3>إضافة منتج جديد</h3>
            <input type="text" id="name" placeholder="اسم المنتج">
            <input type="number" id="price" placeholder="السعر بالريال">
            <select id="cat">
                <option value="men">رجالي</option>
                <option value="dildo">قضبان واقعية</option>
                <option value="anal">شرجي</option>
                <option value="couples">أزواج</option>
                <option value="vibe">هزازات نسائية</option>
            </select>
            <input type="text" id="img" placeholder="رابط صورة المنتج">
            <textarea id="desc" placeholder="وصف المنتج"></textarea>
            <button onclick="addProd()">حفظ ونشر المنتج</button>
        </div>

        <div class="box">
            <h3>المنتجات الحالية</h3>
            <div id="list"></div>
            <button onclick="restore()" style="background:#e11d48; color:#fff;">استعادة المنتجات الافتراضية</button>
        </div>
    </div>

    <script>
        let catalog = JSON.parse(localStorage.getItem('luxe_catalog')) || [];

        function checkPass() {
            if (document.getElementById('pass').value === 'king123') {
                document.getElementById('login').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
                render();
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }

        function render() {
            const list = document.getElementById('list');
            if (!catalog.length) { list.innerHTML = '<p>لا توجد منتجات</p>'; return; }
            list.innerHTML = catalog.map((p, i) => `
                <div class="item">
                    <b>${p.name}</b> - <span style="color:#ffd700;">${p.price} ر.س</span>
                    <button onclick="del(${i})" style="background:red; color:#fff; width:auto; padding:4px 8px; font-size:11px; float:left;">حذف</button>
                    <div style="clear:both;"></div>
                </div>
            `).join('');
        }

        function addProd() {
            const name = document.getElementById('name').value;
            const price = document.getElementById('price').value;
            const cat = document.getElementById('cat').value;
            const img = document.getElementById('img').value;
            const desc = document.getElementById('desc').value;
            if (!name || !price) { alert('يرجى ملء الاسم والسعر'); return; }

            catalog.unshift({ id: Date.now(), name, price: Number(price), cat, imgs: [img], desc });
            localStorage.setItem('luxe_catalog', JSON.stringify(catalog));
            alert('تمت الإضافة بنجاح!');
            render();
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
        }

        function del(i) {
            if (confirm('تأكيد الحذف؟')) {
                catalog.splice(i, 1);
                localStorage.setItem('luxe_catalog', JSON.stringify(catalog));
                render();
            }
        }

        function restore() {
            localStorage.removeItem('luxe_catalog');
            alert('تمت إعادة الضبط!');
            location.reload();
        }
    </script>
</body>
</html>
