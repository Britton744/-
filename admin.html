<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم الشاملة | متجر الملوك LUXE</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: #09030b; color: #fff; padding: 15px; }

        #loginBox {
            max-width: 380px; margin: 60px auto; background: #160818;
            padding: 25px; border-radius: 16px; border: 1.5px solid #dfb872; text-align: center;
        }
        input, select, textarea {
            width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px;
            border: 1px solid #dfb872; background: #000; color: #fff; font-size: 13px; text-align: right; outline: none;
        }
        .btn-gold {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #dfb872, #b45309);
            color: #000; font-weight: 900; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 8px;
        }

        #panelBox { display: none; max-width: 700px; margin: 0 auto; padding-bottom: 50px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(223,184,114,0.3); padding-bottom: 10px; margin-bottom: 15px; }
        .card-box { background: #160818; border: 1px solid rgba(223,184,114,0.3); border-radius: 14px; padding: 15px; margin-bottom: 20px; text-align: right; }
        label { font-size: 11px; color: #dfb872; font-weight: bold; margin-top: 6px; display: block; }

        .prod-item {
            background: #1c0920; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; justify-content: space-between;
        }
        .prod-thumbs-view { display: flex; gap: 4px; }
        .prod-thumbs-view img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid #dfb872; }

        .btn-sm { padding: 6px 10px; border-radius: 6px; border: none; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-edit { background: #eab308; color: #000; }
        .btn-del { background: #ef4444; color: #fff; }

        .img-slot { background: #0c030d; border: 1px dashed #555; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div id="loginBox">
        <h2 style="color:#dfb872; margin-bottom:10px;">👑 إدارة منتجات متجر الملوك</h2>
        <p style="font-size:12px; color:#ccc; margin-bottom:15px;">التحكم بالـ 3 صور والوصف والأسعار</p>
        <input type="text" id="myPass" placeholder="اكتب king123" style="text-align:center;">
        <button class="btn-gold" onclick="loginNow()">دخول اللوحة</button>
        <p id="err" style="color:red; display:none; margin-top:10px;">الرمز غير صحيح!</p>
    </div>

    <div id="panelBox">
        <div class="header">
            <div>
                <h3 style="color:#dfb872;">👑 إدارة الـ 3 صور والوصف</h3>
                <span style="font-size:11px; color:#ccc;">العدد: <b id="prodCount" style="color:#ffd700;">0</b> منتج</span>
            </div>
            <button onclick="location.reload()" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">خروج</button>
        </div>

        <div class="card-box">
            <h4 style="color:#dfb872; margin-bottom:8px;">➕ إضافة منتج جديد (3 صور + وصف):</h4>

            <label>اسم المنتج:</label>
            <input type="text" id="pName" placeholder="مثال: قضيب واقعي سيليكون 23 سم">

            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label>السعر بالريال:</label>
                    <input type="number" id="pPrice" placeholder="780">
                </div>
                <div style="flex:1;">
                    <label>القسم:</label>
                    <select id="pCat">
                        <option value="men">أجهزة استمناء رجالية</option>
                        <option value="dildo">قضبان صناعية وواقعية</option>
                        <option value="anal">سدادات وخرز شرجي</option>
                        <option value="couples">ألعاب أزواج</option>
                        <option value="vibe">هزازات نسائية</option>
                    </select>
                </div>
            </div>

            <!-- رفع الصور الثلاث مباشرة من الاستوديو أو بروابط -->
            <label>🖼️ الصورة 1 (الرئيسية):</label>
            <div class="img-slot">
                <input type="file" accept="image/*" onchange="convertImg(this, 1)">
                <input type="text" id="slotUrl1" placeholder="أو الصق رابط صورة...">
            </div>

            <label>🖼️ الصورة 2:</label>
            <div class="img-slot">
                <input type="file" accept="image/*" onchange="convertImg(this, 2)">
                <input type="text" id="slotUrl2" placeholder="أو الصق رابط صورة...">
            </div>

            <label>🖼️ الصورة 3:</label>
            <div class="img-slot">
                <input type="file" accept="image/*" onchange="convertImg(this, 3)">
                <input type="text" id="slotUrl3" placeholder="أو الصق رابط صورة...">
            </div>

            <label>📝 الوصف والمواصفات الكاملة للمنتج:</label>
            <textarea id="pDesc" rows="4" placeholder="اكتب هنا مميزات المنتج، نوع السيليكون، الأبعاد، وطريقة الاستخدام..."></textarea>

            <button class="btn-gold" onclick="addNewProduct()" style="background:linear-gradient(135deg, #22c55e, #15803d); color:#fff;">
                حفظ وإضافة المنتج للمتجر 🚀
            </button>
        </div>

        <h4 style="text-align:right; margin-bottom:10px; color:#dfb872;">📦 المنتجات الحالية:</h4>
        <div id="list"></div>
    </div>

    <script>
        let prods = JSON.parse(localStorage.getItem('luxe_catalog')) || [];
        let uploadedImgs = { 1: "", 2: "", 3: "" };

        function convertImg(input, slot) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImgs[slot] = e.target.result;
                    alert("تم تحميل الصورة " + slot + " من الجوال بنجاح!");
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function loginNow() {
            var val = document.getElementById("myPass").value.trim().toLowerCase();
            if (val === "king123") {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("panelBox").style.display = "block";
                drawList();
            } else {
                document.getElementById("err").style.display = "block";
            }
        }

        function drawList() {
            document.getElementById("prodCount").innerText = prods.length;
            const container = document.getElementById("list");
            container.innerHTML = "";

            prods.forEach(p => {
                const imgs = (p.imgs && p.imgs.length) ? p.imgs : [p.img || 'https://via.placeholder.com/80'];
                const itemDiv = document.createElement("div");
                itemDiv.className = "prod-item";
                itemDiv.innerHTML = `
                    <div class="prod-thumbs-view">
                        ${imgs.map(s => `<img src="${s}">`).join("")}
                    </div>
                    <div style="flex-grow:1; text-align:right;">
                        <b style="font-size:12px; color:#fff;">${p.name}</b>
                        <div style="font-size:12px; color:#ffd700; font-weight:bold;">${p.price} ر.س</div>
                        <div style="font-size:10px; color:#aaa; margin-top:3px; max-height:28px; overflow:hidden;">${p.desc ? p.desc.substring(0, 50) + '...' : 'بدون وصف'}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        <button class="btn-sm btn-edit" onclick="editProductPrompt(${p.id})">✏️ تعديل</button>
                        <button class="btn-sm btn-del" onclick="delProduct(${p.id})">🗑️ حذف</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        function editProductPrompt(id) {
            const p = prods.find(i => i.id === id);
            if (!p) return;

            const newPrice = prompt(`تعديل سعر [${p.name}]:`, p.price);
            if (newPrice !== null && !isNaN(newPrice) && newPrice.trim() !== "") {
                p.price = Number(newPrice);
            }

            const newDesc = prompt(`تعديل وصف [${p.name}]:`, p.desc || "");
            if (newDesc !== null) {
                p.desc = newDesc;
            }

            localStorage.setItem('luxe_catalog', JSON.stringify(prods));
            drawList();
            alert("تم التحديث بنجاح!");
        }

        function delProduct(id) {
            if (confirm("هل تريد حذف هذا المنتج؟")) {
                prods = prods.filter(i => i.id !== id);
                localStorage.setItem('luxe_catalog', JSON.stringify(prods));
                drawList();
            }
        }

        function addNewProduct() {
            const name = document.getElementById("pName").value.trim();
            const price = Number(document.getElementById("pPrice").value);
            const cat = document.getElementById("pCat").value;
            const desc = document.getElementById("pDesc").value.trim();

            const u1 = document.getElementById("slotUrl1").value.trim();
            const u2 = document.getElementById("slotUrl2").value.trim();
            const u3 = document.getElementById("slotUrl3").value.trim();

            if (!name || isNaN(price) || price <= 0) {
                alert("يرجى إدخال اسم المنتج وسعره بشكل صحيح!");
                return;
            }

            const finalImgs = [];
            const img1 = uploadedImgs[1] || u1;
            const img2 = uploadedImgs[2] || u2;
            const img3 = uploadedImgs[3] || u3;

            if (img1) finalImgs.push(img1);
            if (img2) finalImgs.push(img2);
            if (img3) finalImgs.push(img3);

            prods.unshift({
                id: Date.now(),
                name: name,
                price: price,
                cat: cat,
                imgs: finalImgs.length ? finalImgs : ["https://via.placeholder.com/300"],
                desc: desc || "منتج ملكي فاخر مصنوع من خامات طبية 100%."
            });

            localStorage.setItem('luxe_catalog', JSON.stringify(prods));
            document.getElementById("pName").value = "";
            document.getElementById("pPrice").value = "";
            document.getElementById("pDesc").value = "";
            document.getElementById("slotUrl1").value = "";
            document.getElementById("slotUrl2").value = "";
            document.getElementById("slotUrl3").value = "";
            uploadedImgs = { 1: "", 2: "", 3: "" };

            drawList();
            alert("تمت إضافة المنتج بـ 3 صور ووصف كامل بنجاح 👑");
        }
    </script>
</body>
</html>
