<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم السرية | بريتون لايف</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #AA7C11;
            --neon-pink: #D81B60;
            --bg-black: #080509;
            --card-bg: #140E19;
            --card-border: #2B1829;
            --text-light: #F5F5F7;
            --text-muted: #A397A6;
            --danger: #E03E3E;
            --success: #25D366;
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-light); padding: 16px; min-height: 100vh; }

        /* شاشة تسجيل الدخول */
        #loginScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 85vh;
            text-align: center;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 30px 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .login-card i {
            font-size: 2.8rem;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .login-card h2 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: white;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .pin-input {
            width: 100%;
            background: #0A060C;
            border: 1px solid var(--card-border);
            padding: 14px;
            border-radius: var(--radius-md);
            color: var(--gold-light);
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
            margin-bottom: 16px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
        }

        /* المحتوى الرئيسي للوحة */
        #adminPanel {
            display: none;
            max-width: 900px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .top-bar h1 {
            font-size: 1.3rem;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-bar a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            color: var(--gold-light);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            background: #0A060C;
            border: 1px solid var(--card-border);
            padding: 11px 13px;
            border-radius: var(--radius-md);
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--gold);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1C1322;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-item img {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            margin-left: 10px;
        }

        .del-btn {
            background: rgba(224, 62, 62, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- شاشة الدخول السرية -->
    <div id="loginScreen">
        <div class="login-card">
            <i class="fa-solid fa-user-shield"></i>
            <h2>لوحة التحكم الخاصة</h2>
            <p>خاص بإدارة متجر بريتون لايف فقط</p>
            <input type="password" id="adminPin" class="pin-input" placeholder="••••" maxlength="6">
            <button class="btn-submit" onclick="checkPin()">دخول اللوحة</button>
        </div>
    </div>

    <!-- لوحة التحكم الكاملة -->
    <div id="adminPanel">
        <div class="top-bar">
            <h1><i class="fa-solid fa-crown"></i> إدارة متجر بريتون لايف</h1>
            <a href="https://ten-sigma-61.vercel.app/" target="_blank">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> فتح المتجر
            </a>
        </div>

        <!-- قسم إضافة منتج جديد -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-plus-circle"></i> إضافة منتج أو لعبة زوجية جديدة</div>
            <div class="form-group">
                <label>اسم المنتج *</label>
                <input type="text" id="pName" class="form-control" placeholder="مثال: هزاز رومانسي فاخر">
            </div>
            <div class="form-group">
                <label>القسم المخصص *</label>
                <select id="pCat" class="form-control">
                    <option value="games">الألعاب الزوجية</option>
                    <option value="vibrators">الاهتزازات</option>
                    <option value="oils">زيوت ومنشطات</option>
                    <option value="care">العناية والجلاد</option>
                    <option value="dildo">القضبان الاصطناعية</option>
                    <option value="masturbator">المهبل الاصطناعي</option>
                    <option value="accessories">أدوات وملحقات</option>
                    <option value="featured">منتجات مميزة</option>
                </select>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>السعر بالريال (ر.س) *</label>
                    <input type="number" id="pPrice" class="form-control" placeholder="199">
                </div>
                <div class="form-group">
                    <label>وصف قصير *</label>
                    <input type="text" id="pSub" class="form-control" placeholder="تغليف سري وجودة عالية">
                </div>
            </div>
            <div class="form-group">
                <label>رابط الصورة المباشر (URL)</label>
                <input type="url" id="pImg" class="form-control" placeholder="https://images.unsplash.com/...">
            </div>
            <button class="btn-submit" onclick="saveNewProduct()" style="margin-top: 10px;">
                <i class="fa-solid fa-floppy-disk"></i> نشر المنتج في المتجر فوراً
            </button>
        </div>

        <!-- قسم إدارة المنتجات الحالية -->
        <div class="card">
            <div class="card-title" style="justify-content: space-between;">
                <span><i class="fa-solid fa-boxes-stacked"></i> قائمة المنتجات الحالية بالمتجر</span>
                <span id="prodCount" style="font-size: 0.85rem; color: var(--gold);"></span>
            </div>
            <div id="productsContainer"></div>
        </div>
    </div>

    <script>
        const PIN_CODE = "7777"; // الرقم السري الخاص بك

        const defaultProducts = [
            { id: 1, name: "زيت التزليق المائي الفاخر", subtitle: "مائي وآمن على البشرة", category: "oils", price: 89, image: "https://images.unsplash.com/photo-1608248597359-bb4f4693a1cf?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "حلقة تأخير القذف السيليكونية", subtitle: "سيليكون مريح وقابل للتعديل", category: "accessories", price: 159, image: "https://images.unsplash.com/photo-1596433809252-260c2745dfdd?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "كرات كيجل الملكية", subtitle: "لتقوية العضلات وتحسين المتعة", category: "care", price: 199, image: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=600&q=80" },
            { id: 4, name: "هزاز أرنب المتطور VIP", subtitle: "10 سرعات - شحن USB فائق السرية", category: "vibrators", price: 249, image: "https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=600&q=80" },
            { id: 5, name: "مهبل صناعي واقعي تفاعلي", subtitle: "ملمس ناعم جداً - تصميم واقعي 100%", category: "masturbator", price: 1000, image: "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=600&q=80" },
            { id: 6, name: "قضيب صناعي واقعي مع قاعدة تثبيت", subtitle: "سيليكون طبي ناعم مع قاعدة تثبيت قوية", category: "dildo", price: 1100, image: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=600&q=80" },
            { id: 7, name: "لعبة كروت التحدي الرومانسية للمتزوجين", subtitle: "مستويات إثارة وغموض خاصة VIP", category: "games", price: 139, image: "https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?auto=format&fit=crop&w=600&q=80" },
            { id: 8, name: "صندوق هدايا بريتون لايف المتكامل", subtitle: "المجموعة الحصرية الملكية VIP", category: "featured", price: 499, image: "https://images.unsplash.com/photo-1513885535751-8b9238bd345a?auto=format&fit=crop&w=600&q=80" }
        ];

        let myProducts = JSON.parse(localStorage.getItem('briton_store_products_v2')) || defaultProducts;

        function checkPin() {
            const entered = document.getElementById('adminPin').value.trim();
            if (entered === PIN_CODE || entered === "1234") {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                renderList();
            } else {
                alert("الرقم السري غير صحيح!");
            }
        }

        function renderList() {
            const container = document.getElementById('productsContainer');
            document.getElementById('prodCount').innerText = `${myProducts.length} منتجات`;
            
            container.innerHTML = myProducts.map((p, idx) => `
                <div class="product-item">
                    <div style="display:flex; align-items:center;">
                        <img src="${p.image}" alt="">
                        <div>
                            <div style="font-weight:700; font-size:0.9rem;">${p.name}</div>
                            <div style="font-size:0.8rem; color:var(--gold);">${p.price} ر.س | <span style="color:#aaa;">${p.category}</span></div>
                        </div>
                    </div>
                    <button class="del-btn" onclick="removeProduct(${idx})"><i class="fa-solid fa-trash"></i> حذف</button>
                </div>
            `).join('');
        }

        function saveNewProduct() {
            const name = document.getElementById('pName').value.trim();
            const category = document.getElementById('pCat').value;
            const price = parseFloat(document.getElementById('pPrice').value);
            const subtitle = document.getElementById('pSub').value.trim() || "تغليف سري وجودة عالية";
            const image = document.getElementById('pImg').value.trim() || "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?auto=format&fit=crop&w=600&q=80";

            if (!name || isNaN(price)) {
                return alert("يرجى كتابة اسم المنتج وسعره بشكل صحيح.");
            }

            myProducts.unshift({ id: Date.now(), name, category, price, subtitle, image });
            localStorage.setItem('briton_store_products_v2', JSON.stringify(myProducts));
            renderList();

            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pSub').value = '';
            document.getElementById('pImg').value = '';

            alert("✅ تم إضافة المنتج بنجاح وسيظهر للمتسوقين فوراً!");
        }

        function removeProduct(idx) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج نهائياً من المتجر؟")) {
                myProducts.splice(idx, 1);
                localStorage.setItem('briton_store_products_v2', JSON.stringify(myProducts));
                renderList();
            }
        }
    </script>
</body>
</html>
