<script>
const initialCategories = [
  ['dildos', 'قضبان صناعية'],
  ['vaginal', 'مهبل صناعي'],
  ['vibrators', 'أجهزة هزاز'],
  ['couples', 'ألعاب زوجية'],
  ['games', 'ألعاب وتحديات'],
  ['accessories', 'إكسسوارات وملحقات'],
  ['massage', 'زيوت ومساج'],
  ['romantic', 'مستلزمات رومانسية'],
  ['cards', 'الكتب والبطاقات'],
  ['gifts', 'هدايا ومستلزمات']
];

let storeCategories = initialCategories.map(([id, name]) => ({
  id,
  name
}));

function renderCategories() {
  const rows = document.getElementById('categoryRows');

  rows.innerHTML = storeCategories.map((category, index) => `
    <tr>
      <td>${category.name}</td>
      <td>${category.id}</td>
      <td>نشط</td>
      <td>
        <button onclick="removeCategory(${index})">
          حذف
        </button>
      </td>
    </tr>
  `).join('');
}

function addCategory(event) {
  event.preventDefault();

  const name = document
    .getElementById('categoryName')
    .value.trim();

  const id = document
    .getElementById('categoryId')
    .value.trim();

  if (!name || !id) {
    alert('أدخل اسم القسم ورمزه');
    return;
  }

  if (storeCategories.some(c => c.id === id || c.name === name)) {
    alert('القسم موجود بالفعل');
    return;
  }

  storeCategories.push({ id, name });
  renderCategories();

  alert('تمت إضافة القسم للمعاينة');
}

function removeCategory(index) {
  if (confirm('هل تريد حذف هذا القسم؟')) {
    storeCategories.splice(index, 1);
    renderCategories();
  }
}

renderCategories();
</script>
