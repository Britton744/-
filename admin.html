<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | متجر الملوك</title>
    <style>
        body {
            background-color: #09030b;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 20px;
            direction: rtl;
        }
        .box {
            background-color: #150617;
            border: 1px solid #dfb872;
            max-width: 450px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 12px;
        }
        input, select, textarea {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            background: #000;
            border: 1px solid #dfb872;
            color: #fff;
            border-radius: 6px;
        }
        button {
            background: #dfb872;
            color: #000;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            width: 95%;
        }
        .item {
            background: #230829;
            border: 1px solid rgba(223, 184, 114, 0.3);
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول -->
    <div id="loginSection" class="box">
        <h2 style="color: #dfb872;">👑 لوحة تحكم الملوك</h2>
        <p>أدخل كلمة المرور:</p>
        <input type="password" id="adminPass" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
        <p id="loginError" style="color: red; display: none; margin-top: 8px;">كلمة المرور غير صحيحة!</p>
    </div>

    <!-- قسم إدارة المنتجات -->
    <div id="adminPanel" style="display: none; max-width: 500px; margin: auto;">
        <div class="box">
            <h3 style="color: #dfb872;">إضافة منتج جديد</h3>
            <input type="text" id="pName" placeholder="اسم المنتج">
            <input type="number" id="pPrice" placeholder="السعر بالريال">
            <input type="text" id="pImg" placeholder="رابط صورة المنتج">
            <button onclick="addProduct()">حفظ المنتج</button>
        </div>

        <div class="box">
            <h3 style="color: #dfb872;">المنتجات الحالية</h3>
            <div id="productsList"></div>
            <button onclick="resetData()" style="background: #e11d48; color: #fff; margin-top: 15px;">استعادة المنتجات الافتراضية</button>
        </div>
    </div>

    <script>
        let catalog = JSON.parse(localStorage.getItem('luxe_catalog')) || [];

        function login() {
            const pass = document.getElementById('adminPass').value;
            if (pass === 'king123') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadItems();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function loadItems() {
            const list = document.getElementById('productsList');
            if (catalog.length === 0) {
                list.innerHTML = '<p>لا توجد منتجات مضافة بعد.</p>';
                return;
            }
            list.innerHTML = catalog.map((item, index) => `
                <div class="item">
                    <span>${item.name} - <b>${item.price} ر.س</b></span>
                    <button onclick="removeItem(${index})" style="background: red; color: #fff; width: auto; padding: 4px 8px; font-size: 11px; margin: 0;">حذف</button>
                </div>
            `).join('');
        }

        function addProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImg').value;

            if (!name || !price) {
                alert('يرجى كتابة اسم المنتج والسعر!');
                return;
            }

            catalog.unshift({
                id: Date.now(),
                name: name,
                price: Number(price),
                img: img || 'https://via.placeholder.com/300'
            });

            localStorage.setItem('luxe_catalog', JSON.stringify(catalog));
            alert('تمت إضافة المنتج بنجاح!');
            loadItems();
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImg').value = '';
        }

        function removeItem(index) {
            if (confirm('هل تريد حذف هذا المنتج؟')) {
                catalog.splice(index, 1);
                localStorage.setItem('luxe_catalog', JSON.stringify(catalog));
                loadItems();
            }
        }

        function resetData() {
            if (confirm('هل أنت متأكد من مسح المنتجات والعودة للأصلية؟')) {
                localStorage.removeItem('luxe_catalog');
                alert('تمت الاستعادة بنجاح');
                location.reload();
            }
        }
    </script>
</body>
</html>
